  /* El estacional por aprendizaje va JUNTO al de GloFAS, no en su lugar: son dos
     productos con habilidad muy distinta -el ML gana a la climatologia en 9 de 14
     estaciones y GloFAS corregido en 2 de 18- y verlos juntos enseña de donde
     sale la diferencia. Trazo grueso porque es el que conviene leer. */
  if(E && E.ml && (E.ml.valor||[]).some(x=>x!=null)){

    ley.push(`<span><i style="background:var(--ok);height:3px"></i>estacional ML`

  if(L && L.ml && L.ml.dibujar && (L.ml.valor||[]).some(x=>x!=null)){
    cfg.series.push({v:sobreEje(L.fechas, L.ml.valor), clase:"gr-ens",

function seriePorEscala(s,variable){
  if(!s||M.escala!=="diaria")return s;
  // Lluvia: dia de 07:00 a 07:00 con la fecha del dia en que empieza. La marca
  // es el FINAL de la hora (la de las 07:00 es la lluvia de 06 a 07 y cierra el
  // dia anterior): por eso se resta ademas un minuto.
  const lluvia=variable==="precipitacion", CORTE=lluvia?7*3600000+60000:0, dias=new Map();
  s.t.forEach((t,i)=>{
    const f=new Date(t),g=new Date(f.getTime()-CORTE);
    const k=[g.getFullYear(),String(g.getMonth()+1).padStart(2,"0"),String(g.getDate()).padStart(2,"0")].join("-");
    const z=dias.get(k)||{v:[],vmin:[],horas:new Set(),horasMin:new Set()};
    const paso=Math.floor(f.getTime()/3600000);z.horas.add(paso);
    if(finito(s.v[i]))z.v.push(s.v[i]);
    if(s.v_min&&finito(s.v_min[i])){z.vmin.push(s.v_min[i]);z.horasMin.add(paso);}
    dias.set(k,z);
  });
  const r={t:[],v:[],pasos:[],pasos_min:[]};if(s.v_min)r.v_min=[];
  const hoy=new Date(Date.now()-CORTE),claveAbierta=[hoy.getFullYear(),String(hoy.getMonth()+1).padStart(2,"0"),String(hoy.getDate()).padStart(2,"0")].join("-");
  [...dias.entries()].filter(([k])=>k!==claveAbierta).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([k,g])=>{
    const nv=g.v.length,nm=g.vmin.length;
    let v=null,vmin=null;
    // El agregado se conserva aun cuando falten pasos; el propio punto lleva
    // (N/24) para impedir que un valor parcial se lea como jornada completa.
    // Precipitación usa el día hidrológico 07–07; las demás variables 00–24.
    if(nv){
      if(lluvia)v=g.v.reduce((a,b)=>a+b,0);
      else if(s.v_min)v=Math.max(...g.v);
      else v=g.v.reduce((a,b)=>a+b,0)/nv;
    }
    if(s.v_min&&nm)vmin=Math.min(...g.vmin);
    r.t.push(k+"T12:00:00");r.v.push(v);if(r.v_min)r.v_min.push(vmin);
    r.pasos.push(nv);r.pasos_min.push(s.v_min?nm:nv);
  });
  const nd=Math.max(1,Math.round((+($("#f-horas")||{}).value||168)/24)),ini=Math.max(0,r.t.length-nd);
  for(const k of ['t','v','pasos','pasos_min','v_min'])if(r[k])r[k]=r[k].slice(ini);
  return r;
}

function colorTema(nombre,respaldo){
  const v=getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();
  return v||respaldo;
}
// Plotly no entiende var(--x) ni color-mix(): hay que darle un color resuelto.
// Estas dos funciones son el puente entre el tema de la pagina y el grafico.
function esTemaOscuro(){
  const t=document.documentElement.getAttribute("data-tema");
  if(t==="oscuro")return true;
  if(t==="claro")return false;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function aRGB(c){
  c=(c||"").trim();
  if(c.startsWith("#")){
    let h=c.slice(1);
    if(h.length===3)h=h.split("").map(x=>x+x).join("");
    if(h.length>=6)return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
  }
  const m=c.match(/-?\d+(\.\d+)?/g);
  return m&&m.length>=3?[+m[0],+m[1],+m[2]]:[128,128,128];
}
// mezcla(a,b,t) = a con peso t sobre b. Devuelve #rrggbb.
function mezcla(a,b,t){
  const A=aRGB(a),B=aRGB(b);
  const v=A.map((x,i)=>Math.round(x*t+B[i]*(1-t)));
  return "#"+v.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("");
}
function serieConHuecos(t,v,diaria){
  const x=[],y=[],puentes=[],paso=(diaria?24:1)*3600000;
  let previo=-1;
  for(let i=0;i<t.length;i++){
    const ok=finito(v[i]);
    if(ok&&previo>=0){
      let hayNulo=false;for(let j=previo+1;j<i;j++)if(!finito(v[j])){hayNulo=true;break;}
      const salto=new Date(t[i])-new Date(t[previo]);
      if(hayNulo||salto>paso*1.5){
        x.push(new Date((+new Date(t[previo]) + +new Date(t[i]))/2));y.push(null);
        puentes.push({x:[t[previo],t[i]],y:[v[previo],v[i]]});
      }
    }
    x.push(t[i]);y.push(ok?v[i]:null);if(ok)previo=i;
  }
  return {x,y,puentes};
}
// EL VALOR, EN CADA PUNTO.
//
// Antes esto etiquetaba como mucho `ancho/90` puntos -siete en un grafico de
// 700 px- y ademas, con `soloExtremos`, se quedaba en TRES: el ultimo, el
// maximo y el minimo. Que es lo que pasaba en todas las series que no son
// lluvia. El resultado es que segun la variable y la escala aparecian o no
// aparecian numeros, sin logica visible desde fuera.
//
// Ahora se etiqueta TODO lo que quepa: el limite lo pone el ancho real de la
// etiqueta (unos 8 px por caracter mas aire), no una constante. Con pocos
// puntos salen todos; con 700 puntos horarios se reparten los que caben, que
// es lo unico que se puede hacer sin convertir el grafico en una mancha. El
// ultimo valor, el maximo y el minimo entran siempre, se pongan como se pongan.
function etiquetasSinSolape(v,pasos,diaria,decimales,ancho,soloExtremos=false){
  const validos=v.map((z,i)=>finito(z)?i:null).filter(i=>i!=null);
  if(!validos.length)return v.map(()=>"");
  const may=Math.max(...validos.map(i=>Math.abs(v[i])).filter(Number.isFinite),1);
  const digitos=Math.floor(Math.log10(may))+1+(decimales?decimales+1:0);
  const anchoEtiq=Math.max(24,digitos*7.5+8);
  const limite=Math.max(3,Math.floor((ancho||700)/anchoEtiq));
  const salto=Math.max(1,Math.ceil(validos.length/limite)),mostrar=new Set();
  validos.forEach((i,k)=>{if(k%salto===0)mostrar.add(i)});
  {
    mostrar.add(validos.at(-1));
    mostrar.add(validos.reduce((a,b)=>v[b]>v[a]?b:a));
    mostrar.add(validos.reduce((a,b)=>v[b]<v[a]?b:a));
  }
  return v.map((z,i)=>{
    if(!mostrar.has(i)||!finito(z))return"";
    return num(z,decimales);
  });
}
/* UNA ETIQUETA POR BARRA.
   Las barras usaban el mismo reparto que las lineas: tantas etiquetas como
   cupieran en HORIZONTAL, que con 48 horas era una de cada tres, mas el maximo,
   el minimo y la ultima. Con barras no hace falta renunciar a ninguna: si no
   caben tumbadas se ponen de pie, y de pie ocupan lo que mide la letra de alto,
   no lo que mide el numero de largo.
   Se etiquetan todas las barras con valor. Una barra en cero no se ve, y
   ponerle "0,0" encima llenaria de ceros las horas secas.
   Devuelve tambien el angulo, el tamaño de letra y los pixeles que la etiqueta
   necesita encima de la barra, para reservarlos en el eje. */
function etiquetasBarras(v,decimales,anchoTrazado,visibles){
  const texto=v.map(z=>finito(z)&&z!==0?num(z,decimales):"");
  const hueco=Math.max(1,anchoTrazado||600)/Math.max(1,visibles||v.length);
  const largo=Math.max(1,...texto.map(z=>z.length));
  const tumbada=largo*6.3+6<=hueco;
  // De pie, la caja de una etiqueta mide 1,375 veces su tamaño de letra de
  // ancho, no el tamaño de letra: medido en pantalla, 11 px a 8 px de letra.
  const tam=tumbada?10:Math.max(7,Math.min(10,Math.floor((hueco-.5)/1.375)));
  const alto=tumbada?16:Math.ceil(largo*tam*.62+8);
  return {texto,angulo:tumbada?0:-90,tam,alto};
}
/* Cuanto hay que estirar el eje para que queden `px` libres encima de lo mas
   alto. Si el eje sube una fraccion f, el hueco es f/(1+f) del alto util, asi
   que f = a/(1-a) con a = px/alto. Tope en el 45 %: por encima la serie queda
   aplastada y es preferible que una etiqueta toque el borde. */
function holguraEje(px,util){
  const a=Math.min(.45,Math.max(0,px/Math.max(util,1)));
  return a/(1-a);
}
/* LLUVIA ESTIMADA POR GOES EN EL PUNTO DE LA ESTACION (28-sep-2026, a prueba).
   productos_goes.py deja la lluvia horaria de RRQPE en cada pluviometro de los
   ultimos 7 dias. Se dibuja junto a la observada para ver, estacion por
   estacion, si el satelite aporta: donde la red calla, si llega a tiempo, y
   cuanto se queda corto en la lluvia orografica. */
const RRQPE_EST={d:null,t:0,cargando:null};
function cargarRrqpeEst(){
  if(RRQPE_EST.d&&Date.now()-RRQPE_EST.t<10*60e3)return Promise.resolve(RRQPE_EST.d);
  if(!RRQPE_EST.cargando)RRQPE_EST.cargando=fetch("datos/productos/rrqpe_estaciones.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null).catch(()=>null)
    .then(d=>{RRQPE_EST.d=d;RRQPE_EST.t=Date.now();RRQPE_EST.cargando=null;return d;});
  return RRQPE_EST.cargando;
}
function rrqpeEnSerie(e,codigo,tiempos,diaria){
  const v=e&&e.series&&e.series[codigo];if(!v)return null;
  const porHora=new Map(e.horas.map((h,i)=>[h,v[i]]));
  if(!diaria)return tiempos.map(t=>{const x=porHora.get(String(t).slice(0,16));return finito(x)?x:null;});
  // dia de 07 a 07: la hora que termina a las H es del dia (H - 7 h 1 min)
  const dias=new Map();
  e.horas.forEach((h,i)=>{if(!finito(v[i]))return;
    const f=new Date(new Date(h+":00").getTime()-(7*60+1)*60e3);
    const k=`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,"0")}-${String(f.getDate()).padStart(2,"0")}`;
    const a=dias.get(k)||{s:0,n:0};a.s+=v[i];a.n++;dias.set(k,a);});
  return tiempos.map(t=>{const a=dias.get(String(t).slice(0,10));return a&&a.n>=20?a.s:null;});
}
async function dibujarSeriePlotly(s,d,x,umbrales,etiqVar,lluvia){
  const caja=$("#serie");
  for(let i=0;i<80&&!window.Plotly;i++)await new Promise(r=>setTimeout(r,50));
  if(!window.Plotly){caja.innerHTML=`<div class="vacio">No se pudo cargar el gráfico interactivo</div>`;return;}
  /* LA LEYENDA VA EN HTML, FUERA DE PLOTLY.
     Dentro del grafico se montaba encima de las etiquetas del eje: Plotly
     coloca la leyenda en coordenadas relativas al AREA DE DIBUJO, no debajo de
     las horas, asi que con el margen justo las dos cosas caian en la misma
     banda y quedaba ilegible. Y agrandar el margen para separarlas es quitarle
     alto al grafico, que es lo que se estaba intentando evitar.
     En HTML se coloca sola despues del grafico, cuesta 16 px y no compite con
     nada. */
  caja.innerHTML='<div id="plot-serie" class="plotly-serie" role="img"></div>'
    + '<div id="serie-ley" class="serie-ley"></div>';
  const nodo=$("#plot-serie"),diaria=M.escala==="diaria",unidad=d.unidad;

  /* SE ESPERA A QUE LA CAJA TENGA TAMANO, Y SE ESPERA AQUI ARRIBA.
     No solo Plotly necesita el alto: tambien lo necesita el hueco que se
     reserva encima de la serie para las etiquetas de valor. Midiendo mas
     abajo, cuando se calculaba ese hueco el contenedor todavia valia 0 y salia
     el maximo del 26%, que en un grafico de 340 px es un tercio del alto
     regalado. Una sola espera, arriba, y todo lo que dependa del alto usa la
     medida buena. */
  const altoNodo = await (async () => {
    const t0 = Date.now();
    while (Date.now() - t0 < 1500) {
      if (nodo.clientHeight > 60 && nodo.clientWidth > 60) break;
      await new Promise(r => setTimeout(r, 30));
    }
    return nodo.clientHeight || 0;
  })();
  const azul=colorTema("--acento","#0B5FA5"),lluv=colorTema("--lluvia","#1D6FA8");
  const frio=colorTema("--frio","#2E6FA8"),tinta=colorTema("--tinta","#12181F");
  const tinta3=colorTema("--tinta3","#8A94A6"),linea=colorTema("--linea","#DDE1E8");
  // El fondo estaba fijado a blanco y la reticula, los ticks y las separaciones
  // de dia iban con grises claros escritos a mano. En modo oscuro el resultado
  // era una lamina blanca dentro de una pagina negra, o una reticula gris claro
  // invisible sobre fondo oscuro segun el caso. Ahora TODO sale de las mismas
  // variables CSS que usa el resto de la pagina, asi que el grafico cambia con
  // el tema igual que cualquier otro elemento.
  const fondo=colorTema("--fondo","#FFFFFF"),superficie=colorTema("--superficie","#F7F8FA");
  const tinta2=colorTema("--tinta2","#4A5568");
  const reticula=mezcla(linea,fondo,.72);   // reticula discreta en ambos temas
  const oscuro=esTemaOscuro();
  const bandaAlterna=mezcla(linea,fondo,oscuro?.45:.35);
  const sepDia=mezcla(tinta3,fondo,.75);
  const ancho=Math.max(320,nodo.clientWidth||caja.clientWidth||700),trazas=[],todos=[];
  const fechaHover=(t)=>diaria
    ? new Date(t).toLocaleDateString("es-EC",{day:"2-digit",month:"2-digit",year:"numeric"})
    : new Date(t).toLocaleString("es-EC",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
  const datosCustom=()=>s.t.map(t=>[fechaHover(t)]);
  const agregarPuentes=(puentes,color)=>puentes.forEach(p=>trazas.push({
    type:"scatter",mode:"lines",x:p.x,y:p.y,line:{color,width:1.5,dash:"dot"},
    opacity:.72,hoverinfo:"skip",showlegend:false}));
  const principal=serieConHuecos(s.t,s.v,diaria);s.v.filter(finito).forEach(v=>todos.push(v));
  const vOrden=s.v.filter(finito).sort((a,b)=>a-b);
  const dec=decVar(d.variable,vOrden[Math.floor(vOrden.length/2)]);
  // Con maxima y minima de la hora (temperatura) son DOS series y cada una
  // con su nombre y su color: antes la maxima se llamaba como la variable, iba
  // en el mismo azul que la minima y la minima no salia en la leyenda.
  const conMin=Array.isArray(s.v_min)&&s.v_min.some(finito);
  const calor=colorTema("--calor","#C2410C");
  const colPrin=conMin?calor:azul, nomPrin=conMin?"Máxima":etiqVar;
  const textos=M.mostrarValores&&!lluvia?etiquetasSinSolape(s.v,s.pasos,diaria,dec,ancho,true):null;
  // Ancho util del trazado: el del nodo menos los margenes de los ejes.
  const anchoTraz=ancho-86;
  /* SI NO CABEN TODAS LEGIBLES, SE ENSEÑAN LAS ULTIMAS Y SE ARRASTRA.
     Con valores activados se pide leer cada barra. En escritorio caben todas
     hasta 48 h; con 3 o 7 dias, o con 48 h en un movil, hay menos de 10 px por
     barra y ni de pie cabe una cifra: 48 barras en 270 px daban 18 etiquetas
     montadas unas sobre otras.
     Encoger mas la letra no lo arregla. Se muestran las barras mas recientes
     que caben a 10,5 px cada una y el grafico se arrastra hacia atras, con el eje
     vertical quieto. Los datos son los de la ventana elegida; lo que cambia es
     cuantas se ven a la vez. Sin valores se ve la ventana entera, como antes. */
  let rangoX=null, paneo=false, visibles=s.t.length;
  // Por debajo de 10 px por barra ni la letra minima, 7 px, cabe de pie.
  if(M.mostrarValores && lluvia && s.t.length>1 && anchoTraz/s.t.length<10){
    visibles=Math.max(8,Math.floor(anchoTraz/10.5));
    const i0=Math.max(0,s.t.length-visibles);
    const paso=(new Date(s.t[1])-new Date(s.t[0]))||3600000;
    rangoX=[new Date(new Date(s.t[i0]).getTime()-paso/2).toISOString(),
            new Date(new Date(s.t.at(-1)).getTime()+paso/2).toISOString()];
    paneo=true;
  }
  const etqBar=M.mostrarValores&&lluvia?etiquetasBarras(s.v,1,anchoTraz,visibles):null;
  const altoEtiq=etqBar?etqBar.alto+4:22;
  if(lluvia){
    // sus cifras ya se reparten y se giran solas (etiquetasBarras): se quedan
    trazas.push({type:"bar",_etiquetasPropias:true,x:s.t,y:s.v,name:etiqVar,marker:{color:lluv,line:{width:0}},
      text:etqBar?etqBar.texto:null,textposition:"outside",cliponaxis:paneo,
      textangle:etqBar?etqBar.angulo:0,constraintext:"none",
      textfont:{size:etqBar?etqBar.tam:10,color:azul},
      customdata:datosCustom(),hovertemplate:`%{customdata[0]}<br><b>%{y:.1f} ${unidad}</b><extra></extra>`});
    agregarPuentes(principal.puentes,lluv);
    const est=await cargarRrqpeEst(), sat=rrqpeEnSerie(est,x&&x.codigo,s.t,diaria);
    if(sat&&sat.some(finito)){
      const colSat=colorTema("--atencion","#E07B1F");
      sat.filter(finito).forEach(v=>todos.push(v));
      trazas.push({type:"scatter",mode:"lines+markers",x:s.t,y:sat,name:"Satélite GOES (RRQPE)",
        connectgaps:true,line:{color:colSat,width:1.6},marker:{size:4,color:colSat},
        hovertemplate:`Satélite GOES <b>%{y:.1f} ${unidad}</b><extra></extra>`});
      const m=(est.metricas||{})[x.codigo]||{};
      const txt=[m.sesgo_pct!=null?`sesgo ${m.sesgo_pct>0?"+":""}${m.sesgo_pct} %`:"",
                 m.r_horaria!=null?`r horaria ${num(m.r_horaria,2)}`:""].filter(Boolean).join(", ");
      RRQPE_EST.leyenda={nombre:`Satélite GOES (RRQPE)${txt?" · "+txt:""}`,color:colSat};
    }else RRQPE_EST.leyenda=null;
  }else{
    trazas.push({type:"scatter",mode:M.mostrarValores?"lines+markers+text":"lines+markers",
      x:principal.x,y:principal.y,name:nomPrin,line:{color:colPrin,width:2.6},
      marker:{color:colPrin,size:4},connectgaps:false,text:textos,textposition:"top center",
      cliponaxis:false,textfont:{size:10,color:colPrin},customdata:datosCustom(),
      hovertemplate:`%{customdata[0]}<br>${conMin?"máx. ":""}<b>%{y:.${dec}f} ${unidad}</b><extra></extra>`});
    agregarPuentes(principal.puentes,colPrin);
  }
  if(conMin){
    const minimo=serieConHuecos(s.t,s.v_min,diaria);s.v_min.filter(finito).forEach(v=>todos.push(v));
    const txtMin=M.mostrarValores?etiquetasSinSolape(s.v_min,s.pasos_min,diaria,dec,ancho,true):null;
    trazas.push({type:"scatter",mode:M.mostrarValores?"lines+markers+text":"lines+markers",
      x:minimo.x,y:minimo.y,name:"Mínima",line:{color:frio,width:2.3},marker:{color:frio,size:4},
      connectgaps:false,text:txtMin,textposition:"bottom center",cliponaxis:false,
      textfont:{size:10,color:frio},customdata:datosCustom(),
      hovertemplate:`mín. <b>%{y:.${dec}f} ${unidad}</b><extra></extra>`});
    agregarPuentes(minimo.puentes,frio);
  }
  const shapes=[],anot=[],leyendaSerie=[];
  leyendaSerie.push({nombre:nomPrin, color:lluvia?colorTema("--lluvia","#1D6FA8"):colPrin});
  if(conMin)leyendaSerie.push({nombre:"Mínima", color:frio});
  if(lluvia&&RRQPE_EST.leyenda)leyendaSerie.push(RRQPE_EST.leyenda);
  umbrales.forEach((u,idx)=>{
    const vals=u.valores||s.t.map(()=>u.v),c=u.color.startsWith("var(")
      ? colorTema(u.color.slice(4,-1),idx===0?"#D97706":idx===1?"#C2410C":"#B3261E") : u.color;
    vals.filter(finito).forEach(v=>todos.push(v));
    // EL NOMBRE A LA LEYENDA, EL NUMERO A LA LINEA.
    //
    // La anotacion decia "Calor Muy Alto  28,40" pegada al borde derecho, y por
    // ese texto el margen se reservaba a 104 px. El nombre del umbral es el
    // mismo los 365 dias del año -no cambia, no hay que volver a leerlo- y el
    // valor si. Asi que el nombre va una vez a la leyenda y en la linea queda
    // solo la cifra, que es lo que se compara de un vistazo con la serie.
    trazas.push({type:"scatter",mode:"lines",x:s.t,y:vals,line:{color:c,width:1.5,dash:"dash",shape:"hv"},
      hoverinfo:"skip",showlegend:false,name:u.nombre||u.corto,connectgaps:false});
    // Se anota para la leyenda HTML: el color resuelto, no la variable CSS.
    leyendaSerie.push({nombre:u.nombre||u.corto, color:c, guion:true});
    if(u.leyenda)return;          // la mediana no lleva ni cifra al margen
    const ultimo=[...vals].reverse().find(finito);
    // al margen derecho; si dos umbrales caen cerca, el colocador las separa
    if(finito(ultimo))anot.push({xref:"paper",x:1.004,yref:"y",y:ultimo,text:num(ultimo,dec),
      showarrow:false,xanchor:"left",font:{size:9,color:c},bgcolor:fondo,borderpad:1,_margen:"derecha"});
  });
  // El margen derecho solo se reserva si queda alguna etiqueta que colocar ahi.
  // Con la mediana en la leyenda, lo normal es que no quede ninguna.
  const hayRotuloDerecha = anot.length > 0;
  let lo=Math.min(...todos),hi=Math.max(...todos);if(!finito(lo)||!finito(hi)){lo=0;hi=1}
  if(lluvia)lo=0;const rango=Math.max(hi-lo,Math.abs(hi)*.08,1);
  // HUECO PARA LAS ETIQUETAS.
  //
  // Con `textposition:"outside"` el numero va ENCIMA de la barra o del punto.
  // Si el eje acaba justo en el maximo, ese numero cae fuera del area de
  // dibujo y Plotly lo recorta: los textos existen en el SVG -se pueden contar-
  // pero no se ven. Y aqui el area util es minuscula: el panel mide 150 px y
  // los margenes se comen 86, asi que quedan 64 px para dibujar.
  //
  // Un 10% de margen no basta para una etiqueta de 10 px sobre una barra que
  // ocupa casi todo el alto. Pero el 26% fijo que habia aqui era el numero
  // calculado para un panel de 150 px, y AHORA el area de dibujo pasa de 340.
  //
  // La etiqueta mide lo mismo en pixeles pase lo que pase -unos 18 px con su
  // aire-, asi que como FRACCION del eje tiene que encoger cuando el grafico
  // crece. Dejarlo en 26% regalaba casi un tercio del alto a un hueco vacio y
  // aplastaba la serie contra el suelo.
  const altoUtil = Math.max(altoNodo - 100, 60);
  const pad = rango * (M.mostrarValores
    ? Math.max(.07, holguraEje(altoEtiq, altoUtil))
    : Math.min(.10, Math.max(.03, 10/altoUtil)));
  /* EJE HORARIO CON FECHA SOLO A MEDIANOCHE.
     Se construye a mano en vez de con `tickformat` porque un formato unico no
     puede decir "fecha aqui si, hora alli". Se toman las marcas que Plotly
     pondria con el mismo paso y se rotula cada una segun caiga o no en 00:00. */
  const ejeHorario = () => {
    if(diaria || !s.t.length) return {};
    const t0=new Date(s.t[0]), tf=new Date(s.t[s.t.length-1]);
    const paso=(dtickH||6*3600000);
    const vals=[], txts=[];
    /* Las marcas se alinean a la MEDIANOCHE LOCAL, no a la del meridiano cero.
       `Math.ceil(t/paso)*paso` reparte desde el epoch, que en UTC cae en 00, 06,
       12 y 18; en Ecuador eso son las 19, 01, 07 y 13, asi que ninguna marca
       coincidia con el cambio de dia y la fecha no se escribia nunca. */
    const medianoche=new Date(t0); medianoche.setHours(0,0,0,0);
    let ini=medianoche.getTime();
    while(ini<t0.getTime()) ini+=paso;
    for(let x=ini; x<=tf.getTime(); x+=paso){
      const f=new Date(x);
      vals.push(f.toISOString());
      txts.push(f.getHours()===0
        ? String(f.getDate()).padStart(2,"0")+"/"+String(f.getMonth()+1).padStart(2,"0")
        : String(f.getHours()).padStart(2,"0")+":00");
    }
    return vals.length ? {tickmode:"array", tickvals:vals, ticktext:txts} : {};
  };

  const dias=[],formasDia=[],pasosAnot=[];
  if(!diaria){
    let clave="",alterno=false,desde=null;
    s.t.forEach((t,i)=>{const f=new Date(t),k=f.toDateString();if(k!==clave){
      // SIN BANDAS ALTERNAS. Se pintaban para separar dias, pero la linea
      // vertical de cambio de dia ya lo hace y con mucho menos ruido: el
      // sombreado compite con las propias barras y ensucia la lectura.
      clave=k;desde=t;alterno=!alterno;
      formasDia.push({type:"line",xref:"x",x0:t,x1:t,yref:"paper",y0:0,y1:1,line:{color:sepDia,width:1.2}});
      dias.push({xref:"x",x:t,yref:"paper",y:1.035,text:`<b>${String(f.getDate()).padStart(2,"0")}/${String(f.getMonth()+1).padStart(2,"0")}</b>`,showarrow:false,xanchor:"left",font:{size:10,color:tinta2}});
    }
    // (sin banda final: ya no se sombrea)
    });
  }
  const tickDiario={};
  if(diaria){
    const maxTicks=Math.max(4,Math.floor(ancho/82)),salto=Math.max(1,Math.ceil(s.t.length/maxTicks));
    const indices=[];for(let i=0;i<s.t.length;i+=salto)indices.push(i);
    if(s.t.length&&indices.at(-1)!==s.t.length-1){
      if(s.t.length-1-indices.at(-1)<salto*.55)indices[indices.length-1]=s.t.length-1;
      else indices.push(s.t.length-1);
    }
    tickDiario.tickmode="array";tickDiario.tickvals=indices.map(i=>s.t[i]);
    tickDiario.ticktext=indices.map(i=>{
      const f=new Date(s.t[i]),fecha=String(f.getDate()).padStart(2,"0")+"/"+String(f.getMonth()+1).padStart(2,"0");
      const candidatos=[s.pasos&&s.pasos[i],s.pasos_min&&s.pasos_min[i]].filter(finito);
      const n=candidatos.length?Math.min(...candidatos):24;
      return n<24?`${fecha}<br><span style="font-size:8px">(${n}/24)</span>`:fecha;
    });
  }
  // EJE X: LA FECHA, SIEMPRE.
  // En escala horaria el formato era "%H:%M" a secas, asi que en cuanto pasabas
  // de un dia no habia forma de saber de que dia era cada hora salvo contando
  // las marcas de separacion de arriba. Ahora cada marca lleva dia/mes y hora
  // en dos lineas. El paso entre marcas se calcula con el ancho real del
  // grafico y la ventana pedida -no un dtick fijo de 6 h- para que ni se
  // amontonen en 24 h ni desaparezcan en 32 dias.
  let dtickH;
  if(!diaria){
    const spanH=(s.t.length>1?(new Date(s.t.at(-1))-new Date(s.t[0]))/3600000:24);
    const maxMarcas=Math.max(4,Math.floor(ancho/78));
    const pasos=[1,2,3,6,12,24,48,72,120,168];
    dtickH=(pasos.find(p=>spanH/p<=maxMarcas)||168)*3600000;
  }
  // SIN FONDO SOMBREADO: el area de dibujo va del mismo color que la pagina.
  const layout={autosize:true,showlegend:false,bargap:.24,paper_bgcolor:fondo,plot_bgcolor:fondo,
    // LA LEYENDA NO PUEDE ROBARLE ALTO AL GRAFICO.
    //
    // Primer intento: y:1.14 con 16 px de margen. 1,14 es el 14% del ALTO DEL
    // AREA DE DIBUJO, no 14 px, asi que en un panel corto la leyenda se salia
    // por arriba, Plotly comprimia el area para encajarla y el eje X se quedaba
    // fuera. El grafico aparecia aplastado contra el borde inferior.
    //
    // Con y:1 y yanchor:"bottom" la leyenda se apoya justo en el borde superior
    // del area y crece hacia el margen, que es lo que hay que reservar: 22 px
    // bastan para una fila de 9 px. El area de dibujo no pierde ni un pixel
    // respecto a no tener leyenda.
    // La leyenda va DEBAJO del eje X y centrada. Arriba competia con la cabecera
    // de dias y obligaba a reservar margen superior, que es el que mas se nota
    // porque es donde esta el maximo de la serie.
    // LA LEYENDA, DEBAJO DE LAS ETIQUETAS DEL EJE.
    //
    // Con y:0 el borde superior de la leyenda coincide con el borde inferior del
    // area de dibujo, o sea justo donde Plotly escribe las horas: se montaba
    // encima y no se leia ninguna de las dos cosas. Hay que bajarla el alto de
    // esas etiquetas, y ese hueco hay que reservarlo ademas en el margen.
    // MARGENES AL MINIMO QUE CABE.
    // Entre los cuatro se comian 98 px de alto y 98 de ancho de un lienzo
    // de 914x441. Cada uno se ha bajado a lo que de verdad ocupa su
    // contenido: el rotulo del dia, las etiquetas del eje, la leyenda y la
    // cifra del umbral. Lo que se recorta va entero al area de dibujo.
    // Sin leyenda interna: la dibuja `serie-ley` en HTML, debajo. Asi el
    // margen inferior solo tiene que dar para las etiquetas del eje.
    margin:{l:44,r:hayRotuloDerecha?38:10,t:diaria?12:20,b:diaria?44:32,pad:0},
    showlegend:false,
    font:{family:'"Segoe UI",sans-serif',color:tinta,size:10},
    hovermode:"x unified",hoverlabel:{bgcolor:fondo,bordercolor:linea,font:{color:tinta,size:11}},
    xaxis:{type:"date",automargin:true,fixedrange:false,showline:true,linecolor:tinta3,linewidth:1,
      showgrid:true,gridcolor:reticula,gridwidth:.6,zeroline:false,
      ticks:"outside",ticklen:4,tickcolor:tinta3,tickfont:{color:tinta2,size:9},
      // LA FECHA SOLO EN EL CAMBIO DE DIA.
      // Repetirla en cada paso horario -"17/09 06:00", "17/09 12:00"...-
      // gasta ancho en decir tres veces lo mismo y obliga a leer ocho
      // caracteres para quedarse con dos. A las 00:00 se pone la fecha,
      // porque ahi es donde cambia; en el resto, solo la hora.
      ...(diaria ? {tickformat:"%d/%m"} : ejeHorario()),
      dtick:diaria?undefined:dtickH,...tickDiario,...(rangoX?{range:rangoX}:{})},
    ...(paneo?{dragmode:"pan"}:{}),
    yaxis:{title:{text:`${etiqVar} · ${unidad}`,standoff:6,font:{size:10,color:tinta2}},automargin:true,
      fixedrange:paneo,
      range:[lluvia?0:lo-pad,hi+pad],showline:true,linecolor:tinta3,linewidth:1,mirror:false,
      ticks:"outside",ticklen:4,tickcolor:tinta3,tickfont:{color:tinta2,size:9},
      showgrid:true,gridcolor:reticula,gridwidth:.7,zeroline:lluvia,zerolinecolor:tinta3},
    shapes:[...formasDia,...shapes],annotations:[...dias,...anot]};

  /* EL ALTO, MEDIDO. NO EL QUE PLOTLY SUPONE.
     Cuando no puede determinar el alto del contenedor -y con `height:100%`
     sobre una caja flexible no siempre puede- Plotly usa su valor por defecto:
     450 px. El grafico se dibujaba a 450 dentro de una caja de 190 y todo lo
     que caia por debajo se recortaba, empezando por el eje X. No era que no se
     reajustase: es que nunca supo cual era el alto bueno. */
  // SE MIDE DESPUES DE QUE EL NAVEGADOR HAYA COMPUESTO LA PAGINA.
  //
  // Midiendo en el acto se cogia el min-height de la caja (190) en vez del alto
  // real que le da la rejilla (282), y entonces el observador corregia un
  // instante despues: el grafico aparecia con un tamano y saltaba al definitivo.
  // Ese es el parpadeo de cada recarga. Dos rAF garantizan que el reparto de la
  // rejilla ya esta hecho cuando se pregunta el alto.
  // SE ESPERA A QUE LA CAJA TENGA TAMANO. NO A UN INSTANTE CONCRETO.
  //
  // Esperar "un par de fotogramas" no servia: cuando se mide, el contenedor
  // sigue midiendo 0 y Plotly se queda con SUS valores por defecto, 700x450.
  // Eso producia las dos cosas a la vez -el grafico pequeno y el salto al
  // redibujarse, primero en vertical y luego en horizontal- porque el
  // observador corregia despues, en dos pasos.
  //
  // Preguntar por el tamano hasta que lo haya resuelve los dos: se dibuja UNA
  // vez y con la medida buena. El tope de 1,5 s evita esperar indefinidamente
  // si el panel esta oculto; en ese caso se dibuja con lo que haya y el
  // observador lo ajusta en cuanto se muestre, que es cuando importa.
  // El alto ya se midio al entrar en la funcion; aqui solo se aplica.
  /* EL GRAFICO MIDE LO QUE MIDE SU CAJA, NI UN PIXEL MAS.
     Aqui habia un suelo de 170 px de alto y 320 de ancho. Cuando la caja era
     mas pequeña -ventana baja, zoom del navegador, pantalla estrecha- el
     grafico la desbordaba y se cortaba por abajo, con el eje de horas fuera.
     Medido el 24-sep-2026: grafico de 170 en una caja de 110. Ahora el alto
     minimo lo garantiza la maqueta, que hace scroll antes que aplastar el
     panel, y el grafico se limita a llenar su hueco. */
  layout.height = nodo.clientHeight || altoNodo || 240;
  layout.width  = nodo.clientWidth  || ancho;
  await plotear(nodo,trazas,layout,{responsive:true,displayModeBar:false,scrollZoom:false,doubleClick:"reset"});

  /* `responsive:true` NO basta.
     Plotly, en modo responsive, escucha el redimensionado de la VENTANA. No se
     entera de que su contenedor ha cambiado de alto mientras la ventana sigue
     igual, que es justo lo que pasa aqui: al reorganizar el panel, el grafico
     seguia dibujado a 450 px dentro de una caja de 190 y quedaba recortado, sin
     eje X y con las barras aplastadas contra el borde.
     El observador lo ata al contenedor real. Se guarda en el nodo para no
     acumular uno nuevo en cada repintado. */
  /* AJUSTE AL CONTENEDOR.
     `ajustar()` se llama ADEMAS de observar, y esa es la parte que faltaba: un
     ResizeObserver solo avisa cuando el tamano CAMBIA. Si al engancharlo la caja
     ya tiene su tamano definitivo -que es lo normal: el grafico se dibuja
     mientras el panel aun vale 0 y para cuando termina ya vale 914x441- no se
     dispara nunca, y el grafico se queda con la medida con la que nacio.
     Llamandolo una vez a mano, se corrige siempre; el observador queda para los
     cambios posteriores (plegar un panel, girar la pantalla). */
  // Ancho real con el que se dibujo. Si se dibujo oculto vale 0, y en cuanto
  // se vea se rehace una vez con la medida buena. No se compara con `ancho`,
  // que tiene un suelo de 320 px: en un movil mas estrecho la diferencia
  // seria siempre mayor del 15 % y el grafico se rehria en bucle.
  let anchoDibujo = nodo.clientWidth || 0;
  const ajustar = () => { try {
    const h = nodo.clientHeight || 0;
    const w = nodo.clientWidth  || 0;
    if (h < 40 || w < 40) return;      // oculto o a medio montar: ya volvera
    /* La pagina es dinamica: girar el movil, plegar un panel o cambiar el zoom
       del navegador cambian el ancho, y con el cuantas etiquetas caben y si
       hace falta ventana. Un relayout solo estira el dibujo; se rehace. */
    if (!anchoDibujo || Math.abs(w - anchoDibujo) / anchoDibujo > .15) {
      anchoDibujo = w; pintarSerie(); return; }
    const fl = nodo._fullLayout || {};
    if (Math.abs((fl.height || 0) - h) > 4 || Math.abs((fl.width || 0) - w) > 4){
      /* EL HUECO DEL EJE SE RECALCULA CON EL ALTO NUEVO.
         El margen que se reserva encima de la serie para las etiquetas de valor
         se fija al construir el grafico, cuando el contenedor todavia puede
         valer 0: sale el maximo del 26%. Si despues se corrige el tamano pero
         no el rango, queda un grafico grande con la serie aplastada abajo y un
         tercio del alto vacio. Al cambiar el alto se rehace tambien el rango. */
      const util = Math.max(h - 100, 60);
      const f = M.mostrarValores ? Math.max(.07, holguraEje(altoEtiq, util))
                                 : Math.min(.10, Math.max(.03, 10/util));
      Plotly.relayout(nodo, {height:h, width:w,
        "yaxis.range":[lluvia?0:lo-rango*f, hi+rango*f]});
    }
  } catch (e) {} };
  const cajaLey=document.getElementById("serie-ley");
  // los umbrales, con trazo discontinuo como en el grafico: en cuadro lleno
  // "Calor Alto" y "Máxima" eran la misma muestra
  if(cajaLey) cajaLey.innerHTML = leyendaSerie.map(x=>
    '<span><i style="background:'+(x.guion?'repeating-linear-gradient(90deg,'+x.color+' 0 4px,transparent 4px 7px)':x.color)+'"></i>'+esc(x.nombre)+'</span>').join("")
    + (paneo ? '<span class="ley-paneo">↔ arrastra para ver horas anteriores</span>' : "");

  ajustar();
  if(window.ResizeObserver && !nodo._observador){
    let pend=null;
    nodo._observador=new ResizeObserver(()=>{
      clearTimeout(pend);
      pend=setTimeout(ajustar,120);
    });
    nodo._observador.observe(nodo);
  }
}

/* NORMALES DE LA SERIE LARGA.
   La vista Normales leia solo estadisticas.json, que sale del lago horario
   (desde 2015) y pide tres años con dias completos en cada mes. Iñaquito, con
   51 años de convencional en BANADIH, salia "Sin normales para esta
   estacion" mientras Evolucion le dibujaba sus normales. Ahora, si hay serie
   larga -la misma de Evolucion, con su QC-, se usan sus normales: la media de
   cada mes y la banda p25 a p75. En temperatura, maxima y minima. */
async function dibujarNormalesLargas(xs,d,lluvia){
  const tinta=colorTema("--tinta","#12181F"),tinta2=colorTema("--tinta2","#4A5568"),
        tinta3=colorTema("--tinta3","#8A94A6"),fondo=colorTema("--fondo","#FFFFFF"),
        linea=colorTema("--linea","#DDE1E8"),reticula=mezcla(linea,fondo,.72);
  const temp=d.variable==="temp_aire", ref=xs.find(z=>z&&_hay(z.media));
  const series=temp?[[xs[0],colorTema("--calor","#C2410C"),"Máxima"],[xs[1],colorTema("--frio","#2E6FA8"),"Mínima"]]
                   :[[xs[0],lluvia?colorTema("--lluvia","#1D6FA8"):colorTema("--acento","#0B5FA5"),"Normal"]];
  const periodo=ref.desde===ref.hasta?`${ref.desde}`:`${ref.desde}–${ref.hasta}`;
  /* TODO EL REGISTRO, Y CUANTOS AÑOS SOSTIENEN CADA MES (8-oct-2026). La normal
     de la estacion no es la 1991-2020: es la media de todos sus años completos
     anteriores al actual, y cada mes tiene los suyos (n_anios_mes, de
     evolucion_visor.py). La 1991-2020 esta en la pestaña Climatologia. */
  const nm=(ref.n_anios_mes||[]).filter(n=>n>0);
  const anios=nm.length?(Math.min(...nm)===Math.max(...nm)?`${nm[0]} años`
    :`${Math.min(...nm)}–${Math.max(...nm)} años según el mes`):`${ref.n_anios} años`;
  const nodo=_cajaEvol(`<b>Normal mensual</b> · media de todo el registro, ${periodo} · ${anios}`
    +(ref.historia?` · historia de ${esc(ref.historia.codigo)}`:"")
    +` <span class="evol-aviso">· barra: la mitad central de los años (p25 a p75)</span>`);
  const cats=MESES_CORTO.slice(), dec=decVar(d.variable,ref.media.find(finito)), tr=[];
  for(const [x,col,nom] of series){
    if(!x||!_hay(x.media))continue;
    const m=x.media, p25=x.p25||[], p75=x.p75||[];
    const err={type:"data",symmetric:false,color:mezcla(col,fondo,.35),thickness:1.2,width:4,
      array:m.map((v,i)=>finito(v)&&finito(p75[i])?Math.max(0,p75[i]-v):0),
      arrayminus:m.map((v,i)=>finito(v)&&finito(p25[i])?Math.max(0,v-p25[i]):0)};
    const cd=m.map((_,i)=>[finito(p25[i])?num(p25[i],dec):"—",finito(p75[i])?num(p75[i],dec):"—"]);
    const txt=M.mostrarValores?m.map(v=>finito(v)?num(v,dec):""):null;
    const hov=`${temp?nom+" ":""}%{x}: <b>%{y:.${dec}f} ${d.unidad}</b><br>p25 %{customdata[0]} · p75 %{customdata[1]}<extra></extra>`;
    tr.push(lluvia
      ? {type:"bar",x:cats,y:m,name:nom,marker:{color:col},error_y:err,customdata:cd,
         text:txt,textposition:"outside",cliponaxis:false,textfont:{size:10,color:col},hovertemplate:hov}
      : {type:"scatter",mode:M.mostrarValores?"lines+markers+text":"lines+markers",x:cats,y:m,name:nom,
         line:{color:col,width:2.4},marker:{size:7,color:col,line:{color:fondo,width:1.4}},error_y:err,customdata:cd,
         text:txt,textposition:nom==="Mínima"?"bottom center":"top center",cliponaxis:false,
         textfont:{size:10,color:col},hovertemplate:hov});
  }
  const ejes=_ejesEvol(tinta2,tinta3,reticula);
  const lay={paper_bgcolor:fondo,plot_bgcolor:fondo,margin:{l:52,r:12,t:14,b:30},showlegend:false,
    font:{family:'"Segoe UI",sans-serif',color:tinta,size:10},hovermode:"x unified",bargap:.3,
    hoverlabel:{bgcolor:fondo,bordercolor:linea,font:{color:tinta,size:11}},
    xaxis:Object.assign({},ejes,{type:"category",showgrid:false,categoryorder:"array",categoryarray:cats}),
    yaxis:Object.assign({},ejes,{title:{text:`${temp?"Temperatura":lluvia?"Lluvia mensual":"Media mensual"} · ${d.unidad}`,
      standoff:6,font:{size:10,color:tinta2}},rangemode:lluvia?"tozero":"normal"})};
  _leyendaEvol(series.filter(([x])=>x&&_hay(x.media)).map(([,col,nom])=>[temp?`${nom} normal`:"Normal",col]));
  await _dibujaEvol(nodo,tr,lay);
}
/* ============================================================ EVOLUCION ==
   El año en curso frente a los anteriores y a las normales, desde BANADIH.

   Es la figura de "Evolucion de lluvia" y la de "Cartas diarias" dentro del
   visor, con los mismos datos que el resto del monitor: series largas de
   BANADIH con QC, convencional y automatica unidas por estacion, y normales
   que no incluyen el año en curso. Ver evolucion.py y evolucion_visor.py.

   Lluvia y temperatura se leen por MESES; nivel y caudal, por DIAS.
   Sin sombreados: todo son lineas y marcas, como pidio el usuario para la
   serie temporal.

   La historia de cada estacion se pide a demanda, al abrir la vista, y se
   guarda media hora: no cambia de un latido a otro. */
const EVOL={cache:{},indice:{}};
const VAR_EVOL={precipitacion:["precipitacion"],temp_aire:["temp_max","temp_min"],
                nivel:["nivel"],caudal:["caudal"]};
const MESES_CORTO=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
async function _pedirJSON(url){
  try{const r=await fetch(url,{cache:"no-store"});return r.ok?await r.json():null;}catch(_){return null;}
}
// Que estaciones tienen historia, por variable. Se mira antes de pedir el
// fichero: sin esto, cada estacion nueva dejaba dos 404 en la consola.
async function indiceEvol(variable){
  const c=EVOL.indice[variable];
  if(c&&Date.now()-c.t<30*60e3)return c.x;
  const x=await _pedirJSON(`api/evolucion/${variable}/_indice`);
  const s=Array.isArray(x)?new Set(x):null;
  EVOL.indice[variable]={t:Date.now(),x:s};
  return s;
}
async function cargarEvol(variable,codigo){
  const k=variable+"/"+codigo, c=EVOL.cache[k];
  if(c&&Date.now()-c.t<30*60e3)return c.x;
  const idx=await indiceEvol(variable);
  if(idx&&!idx.has(codigo)){EVOL.cache[k]={t:Date.now(),x:null};return null;}
  const base=`api/evolucion/${variable}/${encodeURIComponent(codigo)}`;
  const [h,a]=await Promise.all([_pedirJSON(base),_pedirJSON(base+".actual")]);
  let x=null;
  if(h){
    x=Object.assign({},h,a||{});
    if(h.diaria)x.diaria=Object.assign({},h.diaria,{actual:(a&&a.diaria&&a.diaria.actual)||[]});
  }
  EVOL.cache[k]={t:Date.now(),x};
  return x;
}
function _cajaEvol(cab){
  const caja=$("#serie");
  caja.innerHTML=`<div class="evol-cab">${cab}</div>`
    +'<div id="plot-evol" class="plotly-serie" role="img"></div>'
    +'<div id="serie-ley" class="serie-ley"></div>';
  return $("#plot-evol");
}
function _leyendaEvol(items){
  const c=$("#serie-ley");
  if(c)c.innerHTML=items.map(([n,col,tipo])=>
    `<span><i style="background:${col}${tipo==="guion"?";background:repeating-linear-gradient(90deg,"+col+" 0 4px,transparent 4px 7px)":""}"></i>${esc(n)}</span>`).join("");
}
function _cabHistoria(x){
  const periodo=x.desde===x.hasta?`${x.desde}`:`${x.desde}–${x.hasta}`;
  // "años anteriores": sin la etiqueta, "2025 · 1 año" junto a "Máxima 2026"
  // se leia como un error de fecha
  let t=x.desde!=null?`años anteriores ${periodo} (${x.n_anios})`:"sin años anteriores";
  const h=x.historia;
  if(h)t+=` · historia de ${esc(h.codigo)}${h.nombre?" "+esc(h.nombre):""}, a ${h.km<1?Math.round(h.km*1000)+" m":num(h.km,1)+" km"}`;
  // lo que falta para las normales, dicho: se enseña lo que hay aunque no alcance
  if(x.aviso)t+=` <span class="evol-aviso">· ${esc(x.aviso)}</span>`;
  return t;
}
/* EL ORDEN DE LOS MESES LO FIJA EL EJE, NO LAS TRAZAS.
   En un eje de categorias Plotly ordena por la primera aparicion. La primera
   traza era el puente de un hueco -marzo a mayo- y el eje salia Mar, May, Ene,
   Feb, Abr...: las lineas iban y volvian y cruzaban el grafico (M5187, 24-sep).
   Por eso cada eje de meses lleva categoryorder "array" con los doce. */
/* LOS HUECOS SE UNEN CON UNA LINEA DISCONTINUA.
   Un tramo sin dato cortaba la serie y se perdia la continuidad: no se veia
   por donde siguio el rio o la lluvia. Ahora el ultimo dato antes del hueco y
   el primero despues se unen con un trazo discontinuo del mismo color, sin
   cursor, de modo que se ve a la vez que ahi no se midio y por donde siguio.
   Es lo mismo que ya hacia la vista Serie. Las series de una misma familia
   -los años de fondo- van todas en una sola traza. */
const _hay=v=>Array.isArray(v)&&v.some(finito);
function _trazaPuente(x,ys,color,ancho,opac){
  const px=[],py=[];
  for(const y of ys){
    if(!Array.isArray(y))continue;
    let prev=-1;
    for(let i=0;i<y.length;i++){
      if(!finito(y[i]))continue;
      if(prev>=0&&i-prev>1){px.push(x[prev],x[i],x[i]);py.push(y[prev],y[i],null);}
      prev=i;
    }
  }
  return px.length?{type:"scatter",mode:"lines",x:px,y:py,line:{color,width:ancho,dash:"4px,3px"},
    opacity:opac,hoverinfo:"skip",showlegend:false,connectgaps:false}:null;
}
function _conPuentes(tr,x,ys,color,ancho,opac){
  const p=_trazaPuente(x,ys,color,ancho,opac);
  if(p)tr.push(p);
  return !!p;
}
async function _dibujaEvol(nodo,trazas,lay){
  for(let i=0;i<60&&!(nodo.clientHeight>40);i++)await new Promise(r=>setTimeout(r,25));
  lay.height=nodo.clientHeight||320; lay.width=nodo.clientWidth||700;
  await plotear(nodo,trazas,lay,configPlotly());
  if(window.ResizeObserver&&!nodo._observador){
    let p=null;
    nodo._observador=new ResizeObserver(()=>{clearTimeout(p);p=setTimeout(()=>{
      const h=nodo.clientHeight,w=nodo.clientWidth;
      if(h>40&&w>40)try{Plotly.relayout(nodo,{height:h,width:w});}catch(_){}},120);});
    nodo._observador.observe(nodo);
  }
}
function _ejesEvol(tinta2,tinta3,reticula){
  return {showline:true,linecolor:tinta3,linewidth:1,ticks:"outside",ticklen:4,tickcolor:tinta3,
          tickfont:{color:tinta2,size:10},showgrid:true,gridcolor:reticula,gridwidth:.6,zeroline:false};
}

async function dibujarEvolucion(){
  const cod=M.sel, varV=$("#f-var").value, vs=VAR_EVOL[varV];
  const caja=$("#serie");

  caja.innerHTML='<div class="vacio">Cargando evolución…</div>';

  if(M.sel!==cod||M.vista!=="evolucion")return;
  if(!xs.some(Boolean)){
    // Ya no se pide un minimo de historia: si no hay vista es que no hay ni un
    // dia completo guardado de la estacion (es nueva, o aun no entro al lago).
    caja.innerHTML=`<div class="vacio">Aún no hay días completos de ${esc(cod)} en el banco<br>`
      +`<span style="font-size:11px">Un día cuenta cuando tiene 18 horas o más en nivel y caudal, `
      +`o 20 en lluvia y temperatura. La serie se rehace cada noche.</span></div>`;
    return;
  }
  if((varV==="nivel"||varV==="caudal")&&xs[0]&&xs[0].diaria)return dibujarEvolDiaria(xs[0].diaria);
  if(varV==="temp_aire")return dibujarEvolTemp(xs[0],xs[1]);
  return dibujarEvolMensual(xs[0]);
}

/* ---- lluvia (y nivel o caudal sin serie diaria): meses ----------------- */
async function dibujarEvolMensual(x){
  const tinta=colorTema("--tinta","#12181F"),tinta2=colorTema("--tinta2","#4A5568"),
        tinta3=colorTema("--tinta3","#8A94A6"),fondo=colorTema("--fondo","#FFFFFF"),
        linea=colorTema("--linea","#DDE1E8"),reticula=mezcla(linea,fondo,.72);
  const rojo="#D62828",verde="#2A9D3A",azul=colorTema("--lluvia","#1D6FA8"),
        gris=mezcla(tinta3,fondo,.55),neg=esTemaOscuro()?"#E8ECF2":"#111111";
  const lluvia=x.variable==="precipitacion", dec=lluvia?0:(x.variable==="nivel"?2:1);
  const mA=x.mes_actual||(new Date().getMonth()+1);
  const cats=MESES_CORTO.map((m,i)=>i===mA-1&&x.dias&&x.dias[i]?`${m} (${x.dias[i]}/${new Date(x.anio,i+1,0).getDate()})`:m);
  const nodo=_cajaEvol(`<b>${lluvia?"Lluvia mensual":"Media mensual"}</b> · ${_cabHistoria(x)}`);
  const tr=[];
  let unidos=false;
  for(const [anio,v] of Object.entries(x.fondo||{}))
    tr.push({type:"scatter",mode:"lines",x:cats,y:v,line:{color:gris,width:.8},opacity:.5,
             hoverinfo:"skip",showlegend:false,connectgaps:false});
  unidos=_conPuentes(tr,cats,Object.values(x.fondo||{}),gris,.8,.5)||unidos;
  for(const [s,c] of [[x.maximo,rojo],[x.media,neg],[x.minimo,verde]])
    unidos=_conPuentes(tr,cats,[s],c,1.3,.7)||unidos;
  const txt=(v)=>M.mostrarValores?v.map(z=>z==null?"":num(z,dec)):null;
  tr.push({type:"scatter",mode:"lines+markers",x:cats,y:x.maximo,name:"Máximo",
    line:{color:rojo,width:2},marker:{symbol:"triangle-up-open",size:8,color:rojo,line:{width:1.6}},
    customdata:x.anio_max,hovertemplate:`Máximo %{y:.${dec}f} ${x.unidad} (%{customdata})<extra></extra>`});
  tr.push({type:"scatter",mode:"lines+markers",x:cats,y:x.media,name:"Media",
    line:{color:neg,width:2,dash:"dash"},marker:{symbol:"square-open",size:7,color:neg,line:{width:1.6}},
    hovertemplate:`Media %{y:.${dec}f} ${x.unidad}<extra></extra>`});
  tr.push({type:"scatter",mode:"lines+markers",x:cats,y:x.minimo,name:"Mínimo",
    line:{color:verde,width:2},marker:{symbol:"triangle-down-open",size:8,color:verde,line:{width:1.6}},
    customdata:x.anio_min,hovertemplate:`Mínimo %{y:.${dec}f} ${x.unidad} (%{customdata})<extra></extra>`});
  // año en curso: meses cerrados con marca llena; el mes que corre, hueco
  const act=x.actual||[], cerr=act.map((v,i)=>i<mA-1?v:null);
  unidos=_conPuentes(tr,cats,[cerr],azul,2,.8)||unidos;
  tr.push({type:"scatter",mode:M.mostrarValores?"lines+markers+text":"lines+markers",x:cats,y:cerr,
    name:String(x.anio),line:{color:azul,width:3},marker:{size:8,color:azul,line:{color:fondo,width:1.5}},
    text:txt(cerr),textposition:"top center",textfont:{size:10,color:azul},cliponaxis:false,
    hovertemplate:`${x.anio}: %{y:.${dec}f} ${x.unidad}<extra></extra>`});
  if(act[mA-1]!=null){
    const pp=cats.map((_,i)=>i===mA-1||i===mA-2?(i===mA-1?act[i]:cerr[i]):null);
    tr.push({type:"scatter",mode:"lines",x:cats,y:pp,line:{color:azul,width:2,dash:"dot"},hoverinfo:"skip",showlegend:false});
    tr.push({type:"scatter",mode:M.mostrarValores?"markers+text":"markers",x:[cats[mA-1]],y:[act[mA-1]],
      marker:{size:9,symbol:"circle-open",color:azul,line:{width:2.2}},
      text:M.mostrarValores?[num(act[mA-1],dec)]:null,textposition:"top center",textfont:{size:10,color:azul},cliponaxis:false,
      hovertemplate:`${x.anio}, mes en curso: %{y:.${dec}f} ${x.unidad} en ${x.dias[mA-1]} días<extra></extra>`});
  }
  // anomalia: en % frente a la media; en unidades si la media es casi cero
  const anom=[],anomTxt=[],anomCol=[],pat=[];
  for(let i=0;i<12;i++){
    const a=act[i],m=x.media[i];
    if(a==null||m==null||i>mA-1){anom.push(null);anomTxt.push("");anomCol.push(azul);pat.push("");continue;}
    const enPct=lluvia&&m>=5, v=enPct?100*(a-m)/m:(a-m);
    anom.push(v);anomTxt.push((v>=0?"+":"−")+num(Math.abs(v),enPct?0:dec)+(enPct?" %":" "+x.unidad));
    anomCol.push(v>=0?"#2F6FD6":"#B5561F");pat.push(i===mA-1?"/":"");
  }
  tr.push({type:"bar",x:cats,y:anom,yaxis:"y2",marker:{color:anomCol,pattern:{shape:pat,fgcolor:fondo,size:5}},
    text:anomTxt,textposition:"outside",cliponaxis:false,textfont:{size:10,color:tinta2},
    hovertemplate:"%{text}<extra>anomalía</extra>",showlegend:false});
  const ma=Math.max(10,...anom.filter(v=>v!=null).map(Math.abs));
  const ejes=_ejesEvol(tinta2,tinta3,reticula);
  const lay={paper_bgcolor:fondo,plot_bgcolor:fondo,margin:{l:52,r:12,t:14,b:36},showlegend:false,
    font:{family:'"Segoe UI",sans-serif',color:tinta,size:10},hovermode:"x unified",
    hoverlabel:{bgcolor:fondo,bordercolor:linea,font:{color:tinta,size:11}},
    xaxis:Object.assign({},ejes,{type:"category",showgrid:false,categoryorder:"array",categoryarray:cats}),
    yaxis:Object.assign({},ejes,{domain:[.32,1],title:{text:`${lluvia?"Lluvia mensual":"Media mensual"} · ${x.unidad}`,standoff:6,font:{size:10,color:tinta2}},rangemode:lluvia?"tozero":"normal"}),
    yaxis2:Object.assign({},ejes,{domain:[0,.24],range:[-ma*1.45,ma*1.45],zeroline:true,zerolinecolor:tinta3,
      title:{text:lluvia?"vs media":"anomalía",standoff:6,font:{size:9,color:tinta2}},tickfont:{color:tinta2,size:8}}),
    bargap:.3};
  // Sin normales no hay anomalia: el panel de abajo sobra y la serie ocupa
  // todo. Se QUITA, no se oculta: un eje oculto sigue pintando su fondo encima
  // del cuarto inferior del grafico y tapaba la serie.
  let trazas=tr;
  if(!anom.some(v=>v!=null)){
    lay.yaxis.domain=[0,1]; delete lay.yaxis2; trazas=tr.filter(z=>z.yaxis!=="y2");
  }
  _leyendaEvol([[String(x.anio),azul],
    ...(_hay(x.maximo)?[["Máximo",rojo]]:[]),...(_hay(x.media)?[["Media",neg,"guion"]]:[]),
    ...(_hay(x.minimo)?[["Mínimo",verde]]:[]),
    ...(Object.keys(x.fondo||{}).length?[["Años anteriores",gris]]:[]),
    ...(unidos?[["Sin dato, tramo unido",tinta3,"guion"]]:[])]);
  await _dibujaEvol(nodo,trazas,lay);
}

/* ---- temperatura: maximas y minimas por meses -------------------------- */

      line:{color:col,width:1,dash:"dot"},name:nom==="máxima"?"Máximo histórico":"Mínimo histórico",

    const pos=nom==="máxima"?"top center":"bottom center";
    tr.push({type:"scatter",mode:M.mostrarValores?"lines+markers+text":"lines+markers",x:cats,y:cerr,
      name:`${nom} ${x.anio}`,line:{color:col,width:3},marker:{size:7,color:col,line:{color:fondo,width:1.4}},
      text:M.mostrarValores?cerr.map(v=>v==null?"":num(v,1)):null,textposition:pos,
      textfont:{size:10,color:col},cliponaxis:false,
      hovertemplate:`${nom} ${x.anio}: %{y:.1f} °C<extra></extra>`});
    if(act[mA-1]!=null){
      let k=mA-2;while(k>=0&&cerr[k]==null)k--;
      if(k>=0)tr.push({type:"scatter",mode:"lines",x:[cats[k],cats[mA-1]],y:[cerr[k],act[mA-1]],
        line:{color:col,width:2,dash:"dot"},hoverinfo:"skip",showlegend:false});
      const nd=x.dias&&x.dias[mA-1];
      tr.push({type:"scatter",mode:M.mostrarValores?"markers+text":"markers",x:[cats[mA-1]],y:[act[mA-1]],
        marker:{size:9,symbol:"circle-open",color:col,line:{width:2.2}},
        text:M.mostrarValores?[num(act[mA-1],1)]:null,textposition:pos,textfont:{size:10,color:col},cliponaxis:false,
        hovertemplate:`${nom} ${x.anio}, mes en curso: %{y:.1f} °C${nd?` en ${nd} días`:""}<extra></extra>`});
    }
    anomTr.push({type:"bar",x:cats,y:act.map((v,i)=>v==null||x.media[i]==null?null:v-x.media[i]),yaxis:"y2",
      name:`anomalía ${nom}`,marker:{color:col,pattern:{shape:cats.map((_,i)=>i===mA-1?"/":""),fgcolor:fondo,size:5}},
      text:act.map((v,i)=>v==null||x.media[i]==null?"":((v-x.media[i])>=0?"+":"−")+num(Math.abs(v-x.media[i]),1)),
      textposition:"outside",cliponaxis:false,textfont:{size:9,color:col},
      hovertemplate:`anomalía ${nom} %{y:+.1f} °C<extra></extra>`,showlegend:false});
  }
  const todas=anomTr.flatMap(t=>t.y).filter(v=>v!=null);

  const ejes=_ejesEvol(tinta2,tinta3,reticula);
  const lay={paper_bgcolor:fondo,plot_bgcolor:fondo,margin:{l:52,r:12,t:14,b:30},showlegend:false,barmode:"group",
    font:{family:'"Segoe UI",sans-serif',color:tinta,size:10},hovermode:"x unified",
    hoverlabel:{bgcolor:fondo,bordercolor:linea,font:{color:tinta,size:11}},
    xaxis:Object.assign({},ejes,{type:"category",showgrid:false,categoryorder:"array",categoryarray:cats}),
    yaxis:Object.assign({},ejes,{domain:[.32,1],title:{text:"Temperatura · °C",standoff:6,font:{size:10,color:tinta2}}}),
    yaxis2:Object.assign({},ejes,{domain:[0,.24],range:[-ma*1.5,ma*1.5],zeroline:true,zerolinecolor:tinta3,

  // sin anomalias, fuera el panel de abajo (ver dibujarEvolMensual)

  _leyendaEvol([[`Máxima ${ref.anio}`,cal],...((tx&&_hay(tx.media))?[["Normal de la máxima",cal,"guion"]]:[]),
                [`Mínima ${ref.anio}`,fri],...((tn&&_hay(tn.media))?[["Normal de la mínima",fri,"guion"]]:[]),
                ...(unidos?[["Sin dato, tramo unido",tinta3,"guion"]]:[])]);
