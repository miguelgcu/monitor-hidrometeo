/* ============================================ PRONOSTICO A LARGO PLAZO =====
   ECMWF SEAS5, del proyecto "Pronóstico a largo plazo": el mismo calculo que
   sus cartas -media de los miembros, kriging con elevacion a 0,025°- pero en
   REJILLA, pintada sobre el mapa con sus mismos niveles y colores. Pulsar una
   celda da su valor. Lluvia, anomalia y razon de cada mes, y el acumulado de
   la temporada. Lo deja src/exportar_seas5.py en datos/seas5/; una
   inicializacion nueva entra sola en la siguiente publicacion. */
const S5={idx:null,t:0,prod:"lluvia",pos:0,capa:null,campos:{}};
async function s5Indice(){
  if(S5.idx&&Date.now()-S5.t<30*60e3)return S5.idx;
  try{const r=await fetch("datos/seas5/indice.json",{cache:"no-store"});
      if(r.ok){S5.idx=await r.json();S5.t=Date.now();}}catch(_){}
  return S5.idx;
}
function s5Producto(){const ps=(S5.idx||{}).productos||[];return ps.find(p=>p.clave===S5.prod)||ps[0];}
function s5Item(){const p=s5Producto();return p?p.items[Math.min(Math.max(S5.pos,0),p.items.length-1)]:null;}
async function s5Campo(clave){
  if(S5.campos[clave])return S5.campos[clave];
  const meta=((S5.idx||{}).campos||{})[clave];if(!meta)return null;
  try{
    const r=await fetch(`datos/seas5/${meta.archivo}`,{cache:"no-store"});if(!r.ok)return null;
    const g=await r.json(),b=atob(g.datos),n=g.nlat*g.nlon,v=new Float32Array(n);
    for(let i=0;i<n;i++){const q=b.charCodeAt(2*i)|(b.charCodeAt(2*i+1)<<8);
      v[i]=q===65535?NaN:g.min+q*g.escala;}
    S5.campos[clave]={...g,v,meta};
  }catch(_){return null;}
  return S5.campos[clave];
}
function s5Clase(val,meta){
  const niv=meta.niveles;let i=0;
  while(i<niv.length&&val>=niv[i])i++;
  // extend "max": bajo el primer nivel -> primer color; "both": color de debajo
  return meta.extend==="both"?i:Math.max(0,i-1);
}
function _rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
/* REJILLA SUAVE, SIN CUADROS (28-sep-2026).
   Las celdas se pintaban tal cual, a bloques de 2 a 11 km, y al acercarse se
   veia un mosaico. Se interpola la rejilla de forma BILINEAL a varias veces su
   resolucion ANTES de clasificarla en niveles: las isolineas salen curvas y
   cada pixel conserva uno de los colores de la leyenda (mezclar colores ya
   clasificados daria tonos que no estan en la escala). Donde la rejilla acaba
   -costa, borde de la caja, celdas sin dato- el borde se funde en vez de
   cortar en escalera. */
/* Recorte al contorno de Ecuador (continente y Galapagos) con la cartografia
   del visor: lo de fuera no se pinta. La caja va en lat/lon, igual que la
   rejilla, asi que el contorno cae donde cae el dato. */
function recortarEcuador(ctx,W,H,n,s,o,e){
  const fc=[(M.carto||{}).provincias,(M.carto||{}).provincias_insular].filter(Boolean);
  if(!fc.length)return;
  ctx.save();ctx.globalCompositeOperation="destination-in";ctx.beginPath();
  const anillo=r=>r.forEach((q,i)=>{const x=(q[0]-o)/(e-o)*W,y=(n-q[1])/(n-s)*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  fc.forEach(g=>(g.features||[]).forEach(f=>{
    const geo=f.geometry||{},pol=geo.type==="Polygon"?[geo.coordinates]:geo.type==="MultiPolygon"?geo.coordinates:[];
    pol.forEach(pl=>pl.forEach(anillo));}));
  ctx.fillStyle="#000";ctx.fill("evenodd");ctx.restore();
}
function rejillaSuave(c,clase,recorte){
  const k=recorte?"_png_r":"_png";
  if(c[k])return c[k];
  return (c[k]=rejillaSuaveDibujar(c,clase,recorte));
}
function rejillaSuaveDibujar(c,clase,recorte){
  // c.factor: la capa de Climatologia lo fija ella (una rejilla de 0,25° necesita
  // mas de 8 para que el recorte de la costa no salga en escalera)
  const f=c.factor||Math.max(1,Math.min(8,Math.round(1800/Math.max(c.nlon,c.nlat))));
  const W=c.nlon*f,H=c.nlat*f,cols=c.meta.colores.map(_rgb);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d"),im=ctx.createImageData(W,H),d=im.data,v=c.v,nx=c.nlon,ny=c.nlat;
  for(let i=0;i<H;i++){
    const y=(i+.5)/f-.5,y0=Math.max(0,Math.floor(y)),y1=Math.min(ny-1,y0+1),fy=Math.min(1,Math.max(0,y-y0));
    for(let j=0;j<W;j++){
      const x=(j+.5)/f-.5,x0=Math.max(0,Math.floor(x)),x1=Math.min(nx-1,x0+1),fx=Math.min(1,Math.max(0,x-x0));
      const a=v[y0*nx+x0],b=v[y0*nx+x1],cc=v[y1*nx+x0],dd=v[y1*nx+x1];
      const wa=(1-fx)*(1-fy),wb=fx*(1-fy),wc=(1-fx)*fy,wd=fx*fy;
      let s=0,w=0;
      if(a===a){s+=a*wa;w+=wa;} if(b===b){s+=b*wb;w+=wb;}
      if(cc===cc){s+=cc*wc;w+=wc;} if(dd===dd){s+=dd*wd;w+=wd;}
      if(w<.35)continue;                                  // mas de medio vecindario sin dato
      // bajo el primer nivel de una escala "max" no se pinta: la llovizna de
      // menos de 1 mm de CHIRPS salia en gris cubriendo todo el pais
      if(c.meta.extend==="max"&&s/w<c.meta.niveles[0])continue;
      const [r,g,bl]=cols[Math.min(clase(s/w,c.meta),cols.length-1)],k=4*(i*W+j);
      d[k]=r;d[k+1]=g;d[k+2]=bl;d[k+3]=Math.round(255*Math.min(1,(w-.35)/.4));
    }
  }
  ctx.putImageData(im,0,0);
  if(recorte)recortarEcuador(ctx,W,H,c.lat_n+c.dlat/2,c.lat_n-(c.nlat-.5)*c.dlat,
                             c.lon_o-c.dlon/2,c.lon_o+(c.nlon-.5)*c.dlon);
  return cv.toDataURL("image/png");
}
function s5Dibujar(c){
  if(S5.capa){MAPA_L.removeLayer(S5.capa);S5.capa=null;}
  if(!c)return;
  const n=c.lat_n+c.dlat/2,s=c.lat_n-(c.nlat-.5)*c.dlat,o=c.lon_o-c.dlon/2,e=c.lon_o+(c.nlon-.5)*c.dlon;
  if(!MAPA_L.getPane("seas5")){const pn=MAPA_L.createPane("seas5");pn.style.zIndex="350";}
  S5.capa=L.imageOverlay(rejillaSuave(c,s5Clase,true),[[s,o],[n,e]],
    {pane:"seas5",opacity:.82,interactive:true,className:"capa-rejilla"}).addTo(MAPA_L);
  S5.capa.on("click",ev=>{
    const f=Math.floor((n-ev.latlng.lat)/c.dlat),k=Math.floor((ev.latlng.lng-o)/c.dlon);
    if(f<0||k<0||f>=c.nlat||k>=c.nlon)return;
    const val=c.v[f*c.nlon+k];if(!(val===val))return;
    const dec=c.meta.unidad==="mm"?0:2;
    setTimeout(()=>abrirFicha(`<div class="mp-cab"><b>${esc(c.meta.titulo.split("·")[0])}</b></div>
      <div class="mp-nom" style="white-space:normal;max-width:240px">${esc(c.meta.titulo.split("·").slice(1).join("·").trim())}</div>
      <div class="mp-valor">${num(val,dec)} ${esc(c.meta.unidad)}</div>
      <div class="mp-pie">ECMWF SEAS5 · inicialización ${esc(S5.idx.inicializacion_texto||"")} · celda de 0,025°</div>`,
      ev.latlng,MAPA_L),0);
  });
}
function s5EscalaHTML(meta){
  if(!meta)return"";
  const cols=meta.colores,niv=meta.niveles,dec=meta.unidad==="mm"?0:2;
  const marcas=niv.map(v=>num(v,v%1?dec:0));
  return `<div class="s5-escala">${cols.map(c=>`<i style="background:${c}"></i>`).join("")}</div>
    <div class="s5-marcas">${marcas.filter((_,i)=>i%Math.ceil(marcas.length/7)===0||i===marcas.length-1)
      .map(m=>`<span>${esc(m)}</span>`).join("")}</div>
    <div class="capa-sub">${esc(meta.unidad)}${meta.extend==="both"?" · centrada en lo normal":""}</div>`;
}
function s5PanelPintar(){
  const pn=document.getElementById("seas5-panel");if(!pn)return;
  pn.hidden=!M.mapa.seas5||!S5.idx;
  if(pn.hidden)return;
  const p=s5Producto(),it=s5Item(),meta=it&&S5.idx.campos[it.campo];

      `Largo plazo · ECMWF SEAS5, inicialización ${esc(S5.idx.inicializacion_texto||"")}`,
      S5.pos<=0,!p||S5.pos>=p.items.length-1)+s5EscalaHTML(meta);
  pn.querySelector("[data-panel-sel]").onchange=e=>{
    const mes=(s5Item()||{}).mes;S5.prod=e.target.value;
    const i=(s5Producto().items||[]).findIndex(x=>x.mes===mes);S5.pos=i>=0?i:0;s5Pintar();};
  pn.querySelectorAll("[data-panel-mueve]").forEach(b=>b.onclick=()=>{
    S5.pos=Math.min(Math.max(S5.pos+ +b.dataset.paso,0),s5Producto().items.length-1);s5Pintar();});
}
async function s5Pintar(){
  if(!MAPA_L)return;
  if(!M.mapa.seas5){if(S5.capa){MAPA_L.removeLayer(S5.capa);S5.capa=null;}s5PanelPintar();return;}
  await s5Indice();

function s5Alternar(){

/* ============================================== PRODUCTOS (28-sep-2026) =====
   Capas en rejilla de varias fuentes, todas con el formato de SEAS5 (enteros
   de 16 bits en base64 y sus niveles y colores), para probar que aporta cada
   una: lluvia estimada por GOES (RRQPE) acumulada, el ambiente de GOES (agua
   precipitable, CAPE, LI, radiacion, temperatura de superficie), CHIRPS,
   IMERG, temperatura del mar, LHASA (deslizamientos) y GFM (inundacion vista
   por radar). Cada fuente deja datos/productos/<fuente>.json; la que no esta
   -o aun no tiene credenciales- sencillamente no aparece en el selector.
   Pulsar una celda da su valor. */
// Largo plazo (SEAS5) entra aqui como una fuente mas (28-sep-2026): sale de
// datos/seas5/, con el mismo formato, y ya no tiene boton propio en el mapa.
const PR_FUENTES=["multimodelo","pronostico","rrqpe","goes_l2","imerg","chirps","sst","lhasa","gfm","seas5"];
const PR_RUTA={seas5:"datos/seas5/"};
const PR_CORTO={multimodelo:"Lluvia multimodelo",pronostico:"Pronóstico",rrqpe:"Lluvia GOES",goes_l2:"Ambiente GOES",imerg:"Lluvia IMERG",chirps:"Lluvia CHIRPS",
                sst:"Mar",lhasa:"Deslizamientos",gfm:"Inundación GFM",seas5:"Largo plazo SEAS5"};
const PR={idx:{},t:0,sel:null,pos:null,capa:null,capaGal:null,campos:{},extra:{},mm:{}};
/* El multimodelo trae un producto por ventana (3, 6 y 24 h) y por extremo de
   temperatura. En el selector va UNA entrada por variable y el periodo se elige
   dentro del panel (28-sep-2026): tres entradas casi iguales en la lista solo
   estorbaban. */
const MM_GRUPOS={lluvia:{nombre:"Lluvia",claves:[["h3","3 h"],["h6","6 h"],["h24","24 h"]],defecto:"h24"},
                 temperatura:{nombre:"Temperatura",claves:[["tmax","Máxima"],["tmin","Mínima"]],defecto:"tmax"}};
async function prIndices(){
  if(Object.keys(PR.idx).length&&Date.now()-PR.t<10*60e3)return PR.idx;
  const res=await Promise.all(PR_FUENTES.map(f=>fetch(f==="seas5"?"datos/seas5/indice.json":`datos/productos/${f}.json`,
      {cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)));
  const idx={};
  PR_FUENTES.forEach((f,i)=>{if(res[i]&&(res[i].productos||[]).length)idx[f]=res[i];});
  if(idx.seas5){
    const x=idx.seas5;
    x.nombre="Largo plazo · ECMWF SEAS5";
    x.nota=`Pronóstico estacional ECMWF SEAS5, inicialización ${x.inicializacion_texto||""}: `
      +`media de los miembros llevada a 0,025° con kriging por elevación.`;
    x.productos.forEach(q=>{if(q.clave==="total")q.nombre="Temporada";else if(!/mensual/.test(q.nombre))q.nombre+=" mensual";});
  }
  PR.idx=idx;PR.t=Date.now();PR.campos={};
  if(idx.rrqpe){
    try{const r=await fetch("datos/productos/rrqpe_estaciones.json",{cache:"no-store"});
        if(r.ok)PR.extra.rrqpe=await r.json();}catch(_){}
  }
  return idx;
}
function prOpciones(){
  const o=[];
  for(const [f,x] of Object.entries(PR.idx)){
    if(f==="multimodelo"){
      const hay=new Set(x.productos.map(q=>q.clave));
      for(const [g,d] of Object.entries(MM_GRUPOS))
        if(d.claves.some(([c])=>hay.has(c)))o.push([`multimodelo|${g}`,`Multimodelo · ${d.nombre}`]);
      continue;
    }
    for(const q of x.productos)o.push([`${f}|${q.clave}`,`${PR_CORTO[f]||String(x.nombre).split("·")[0].trim()} · ${q.nombre}`]);
  }
  return o;
}
function prProducto(){
  let [f,c]=String(PR.sel||"").split("|");const x=PR.idx[f];
  if(f==="multimodelo"&&MM_GRUPOS[c]){
    const g=MM_GRUPOS[c],hay=new Set((x&&x.productos||[]).map(q=>q.clave));
    const elegido=PR.mm[c]&&hay.has(PR.mm[c])?PR.mm[c]:(hay.has(g.defecto)?g.defecto:(g.claves.find(([k])=>hay.has(k))||[])[0]);
    const q=x&&x.productos.find(z=>z.clave===elegido);
    return q?{f,x,q,grupo:c}:null;
  }
  const q=x&&x.productos.find(z=>z.clave===c);
  return q?{f,x,q}:null;
}
function prItem(){
  const a=prProducto();if(!a)return null;
  const n=a.q.items.length;if(PR.pos==null)PR.pos=n-1;   // al entrar, lo mas reciente
  return a.q.items[Math.min(Math.max(PR.pos,0),n-1)];
}
async function prCampo(f,campo){
  const k=f+"|"+campo;if(PR.campos[k])return PR.campos[k];
  const meta=((PR.idx[f]||{}).campos||{})[campo];if(!meta)return null;
  try{
    const r=await fetch(`${PR_RUTA[f]||"datos/productos/"}${meta.archivo}`,{cache:"no-store"});if(!r.ok)return null;
    const g=await r.json(),b=atob(g.datos),n=g.nlat*g.nlon,v=new Float32Array(n);
    for(let i=0;i<n;i++){const q=b.charCodeAt(2*i)|(b.charCodeAt(2*i+1)<<8);
      v[i]=q===65535?NaN:g.min+q*g.escala;}
    PR.campos[k]={...g,v,meta};
  }catch(_){return null;}
  return PR.campos[k];
}
function prQuitar(){
  if(PR.capa&&MAPA_L){MAPA_L.removeLayer(PR.capa);}PR.capa=null;
  if(PR.capaGal&&MAPA_GAL){MAPA_GAL.removeLayer(PR.capaGal);}PR.capaGal=null;
}
function prDecimales(u,v){
  if(/J\/kg|W\/m|%/.test(u||""))return 0;
  return Math.abs(v)<10?1:0;
}
function prDibujar(c,fuente){
  prQuitar();if(!c||!MAPA_L)return;
  const n=c.lat_n+c.dlat/2,s=c.lat_n-(c.nlat-.5)*c.dlat,o=c.lon_o-c.dlon/2,e=c.lon_o+(c.nlon-.5)*c.dlon;
  // la temperatura del mar es del mar: esa no se recorta al pais
  const url=rejillaSuave(c,s5Clase,fuente!=="sst"),caja=[[s,o],[n,e]];
  const clic=mapa=>ev=>{
    const f=Math.floor((n-ev.latlng.lat)/c.dlat),k=Math.floor((ev.latlng.lng-o)/c.dlon);
    if(f<0||k<0||f>=c.nlat||k>=c.nlon)return;
    const val=c.v[f*c.nlon+k];if(!(val===val))return;
    const t=String(c.meta.titulo||"").split("·");
    // temporal (28-sep-2026): una ventana breve que se cierra sola a los 4 s
    const pp=L.popup({closeButton:false,autoPan:false,maxWidth:260}).setLatLng(ev.latlng)
      .setContent(`<b>${esc(t[0])}</b><br><span style="font-size:15px;font-weight:600">${num(val,prDecimales(c.meta.unidad,val))} ${esc(c.meta.unidad||"")}</span>`
        +`<br><span style="font-size:10.5px;opacity:.75">${esc(t.slice(1).join("·").trim())}</span>`).openOn(mapa);
    setTimeout(()=>{try{mapa.closePopup(pp);}catch(_){}},4000);
  };
  for(const [mapa,clave] of [[MAPA_L,"capa"],[MAPA_GAL,"capaGal"]]){
    if(!mapa)continue;
    if(clave==="capaGal"&&o>-89)continue;                 // la rejilla no llega a Galapagos
    if(!mapa.getPane("productos")){const pn=mapa.createPane("productos");pn.style.zIndex="352";}
    PR[clave]=L.imageOverlay(url,caja,{pane:"productos",opacity:.82,interactive:true,className:"capa-rejilla"}).addTo(mapa);
    PR[clave].on("click",clic(mapa));
  }
}
function prEscalaHTML(meta){
  if(!meta)return"";
  const niv=meta.niveles,marcas=niv.map(v=>num(v,v%1?1:0));
  return `<div class="s5-escala">${meta.colores.map(c=>`<i style="background:${c}"></i>`).join("")}</div>
    <div class="s5-marcas">${marcas.filter((_,i)=>i%Math.ceil(marcas.length/7)===0||i===marcas.length-1)
      .map(m=>`<span>${esc(m)}</span>`).join("")}</div>

async function prPintar(){
  if(!MAPA_L)return;
  if(!M.mapa.productos){prQuitar();mosaicoCerrar();prPanelPintar();return;}
  await prIndices();
  const ops=prOpciones();
  if(!ops.some(o=>o[0]===PR.sel)){PR.sel=(ops.find(o=>o[0]==="rrqpe|movil")||ops[0]||[null])[0];PR.pos=null;}
  // en un pronostico se abre el primer dia, no el ultimo
  if(PR.pos==null&&/^(pronostico|multimodelo)\|/.test(String(PR.sel)))PR.pos=0;
  const a=prProducto(),it=prItem();

    prPanelPintar();await mosaicoPintar(a,it);return;
  }

}

/* MOSAICO MULTIMODELO (28-sep-2026).
   La lluvia prevista de todos los modelos a la vez, un mapa pequeño por
   modelo en una cuadricula que ocupa el mapa, con el mismo tiempo y la misma
   escala: se ve de un golpe donde coinciden y donde no. El ultimo es el
   multimodelo, ponderado por el desempeño que cada modelo tiene en la
   verificacion contra las estaciones. Los mapas se mueven juntos. */
const MOS={mapas:{},capas:{},clave:null,sincronizando:false};
function mosaicoCerrar(){
  for(const k in MOS.mapas){try{MOS.mapas[k].remove();}catch(_){}}
  MOS.mapas={};MOS.capas={};MOS.clave=null;
  const m=document.getElementById("mosaico");if(m)m.remove();
  const c=document.getElementById("mapa");if(c)c.classList.remove("con-mosaico");
}
function mosaicoBanda(a,it){
  const e=new Date(((a.x.emision||a.x.generado||"")+"").slice(0,10)+"T00:00:00"),f=new Date(String(it.fecha).slice(0,10)+"T00:00:00");
  const d=Math.round((f-e)/864e5)+1;
  return d<=3?"1-3":d<=7?"4-7":"8-10";
}
async function mosaicoPintar(a,it){
  prQuitar();
  const caja=document.getElementById("mapa");if(!caja||!MAPA_L)return;
  caja.classList.add("con-mosaico");
  const mods=(a.x.modelos||[]).filter(md=>(it.campos||{})[md.id])
    .sort((p,q)=>(q.id==="multi")-(p.id==="multi"));
  let m=document.getElementById("mosaico");
  if(!m){m=document.createElement("div");m.id="mosaico";m.className="mosaico";caja.appendChild(m);}
  // todo el mapa salvo la columna de botones (izquierda) y el panel (abajo)
  const R=caja.getBoundingClientRect();
  const bot=caja.querySelector(".mapa-botones"),pan=document.getElementById("prod-panel");
  const izq=bot&&bot.offsetParent?Math.round(bot.getBoundingClientRect().right-R.left)+10:12;
  const abajo=pan&&!pan.hidden?Math.round(R.bottom-pan.getBoundingClientRect().top)+8:8;
  Object.assign(m.style,{left:izq+"px",top:"8px",right:"8px",bottom:abajo+"px"});
  /* un modelo sin campo ese dia (ICON arranca un dia despues que los demas) no
     deja un hueco en la cuadricula: su celda queda con el aviso */
  const faltan=(a.x.modelos||[]).filter(md=>md.id!=="multi"&&!(it.campos||{})[md.id]);
  const clave=mods.map(x=>x.id).join(",")+"|"+faltan.map(x=>x.id).join(",");
  if(MOS.clave!==clave){
    for(const k in MOS.mapas){try{MOS.mapas[k].remove();}catch(_){}}
    MOS.mapas={};MOS.capas={};
    m.innerHTML=mods.map(md=>`<div class="mos-celda${md.id==="multi"?" mos-multi":""}">
      <div class="mos-cab" id="mos-cab-${md.id}"></div><div class="mos-mapa" id="mos-${md.id}"></div></div>`).join("")
      +faltan.map(md=>`<div class="mos-celda"><div class="mos-cab"><b>${esc(md.nombre)}</b></div>
      <div class="mos-nota">Su corrida no cubre este día</div></div>`).join("");
    const B=(M.carto&&M.carto.bounds)||[-81.1,-5.05,-75.15,1.5];
    const lineas=getComputedStyle(document.documentElement).getPropertyValue("--tinta3")||"#8A94A6";
    mods.forEach(md=>{
      const mp=L.map(`mos-${md.id}`,opcionesMapa());
      if(M.carto&&M.carto.provincias)L.geoJSON(M.carto.provincias,{interactive:false,
        style:{color:lineas.trim(),weight:.7,opacity:.8,fill:false}}).addTo(mp);
      /* Sincronia por ZONA, no por centro y zoom: las celdas tienen tamaños
         distintos (la del multimodelo es mayor) y copiar el zoom de una pequeña
         dejaba a Ecuador diminuto y descentrado en la grande. Al mover una, las
         demas muestran la misma zona a su propio tamaño. */
      mp.on("moveend",()=>{if(MOS.sincronizando)return;MOS.sincronizando=true;
        const b=mp.getBounds();
        for(const k in MOS.mapas)if(MOS.mapas[k]!==mp)MOS.mapas[k].fitBounds(b,{animate:false});
        MOS.sincronizando=false;});
      MOS.mapas[md.id]=mp;
    });
    MOS.clave=clave;
    // el encuadre, cuando la cuadricula ya tiene su tamaño final
    MOS.sincronizando=true;
    await new Promise(r=>setTimeout(r,40));   // rAF no corre con la pestaña oculta
    for(const k in MOS.mapas){const mp=MOS.mapas[k];mp.invalidateSize(false);
      mp.fitBounds(MAPA_L.getBounds(),{padding:[6,6],animate:false,maxZoom:VISTA_MAPA.maxZoom});}
    MOS.sincronizando=false;
  }
  const banda=mosaicoBanda(a,it);
  for(const md of mods){
    const cab=document.getElementById(`mos-cab-${md.id}`);
    // en temperatura el peso y la metrica son los suyos (1/MAE), no los de la lluvia
    const cl=a.q.clave,temp=cl==="tmax"||cl==="tmin";
    const deBanda=v=>v&&typeof v==="object"?v[banda]:v;
    const peso=temp?deBanda(md["peso_"+cl]):deBanda(md.peso);
    const met=temp?deBanda(md["mae_"+cl]):deBanda(md.ets);
    const etqMet=temp?"MAE":"ETS",unMet=temp?" °C":"";
    if(cab){cab.innerHTML=`<b>${esc(md.nombre)}</b>`
      +(peso!=null?` · peso ${num(100*peso,0)} %`:"")
      +(met!=null?` · ${etqMet} ${num(met,2)}${unMet}`:"");
      cab.title=`${md.nombre}${md.corrida?", corrida "+md.corrida:""}`
        +(peso!=null?`, peso en el multimodelo ${num(100*peso,0)} %`:"")
        +(met!=null?`, ${etqMet} verificado en las estaciones ${num(met,2)}${unMet}`:"");}
    const c=await prCampo(a.f,it.campos[md.id]);
    const mp=MOS.mapas[md.id];if(!mp)continue;
    if(MOS.capas[md.id]){mp.removeLayer(MOS.capas[md.id]);MOS.capas[md.id]=null;}
    if(!c)continue;
    const n=c.lat_n+c.dlat/2,s=c.lat_n-(c.nlat-.5)*c.dlat,o=c.lon_o-c.dlon/2,e=c.lon_o+(c.nlon-.5)*c.dlon;
    const capa=L.imageOverlay(rejillaSuave(c,s5Clase,true),[[s,o],[n,e]],{opacity:.9,interactive:true,className:"capa-rejilla"}).addTo(mp);
    capa.on("click",ev=>{
      const f=Math.floor((n-ev.latlng.lat)/c.dlat),k=Math.floor((ev.latlng.lng-o)/c.dlon);
      if(f<0||k<0||f>=c.nlat||k>=c.nlon)return;
      const val=c.v[f*c.nlon+k];
      const un=(c.meta&&c.meta.unidad)||"mm";
      const pp=L.popup({closeButton:false,autoPan:false}).setLatLng(ev.latlng)
        .setContent(`<b>${esc(md.nombre)}</b><br>${val===val?num(val,1)+" "+esc(un):(un==="mm"?"sin lluvia":"sin dato")}`).openOn(mp);
      // temporal: se cierra sola a los 4 s
      setTimeout(()=>{try{mp.closePopup(pp);}catch(_){}},4000);
    });
    MOS.capas[md.id]=capa;
    capa.bringToBack();
  }
}

/* Solo el encuadre inicial o una petición explícita cambian la cámara.
   Se espera a tener tamaño real y no se convierte el zoom resultante en un
   mínimo dinámico: los límites se fijan una sola vez, como en HidroMet. */
function encuadrar(mapa,limites,margen,zoomTope=8){
  if(!mapa)return false;
  const c=mapa.getContainer();
  if(!c||c.clientWidth<60||c.clientHeight<60)return false;
  mapa.invalidateSize({animate:false,pan:false});
  const opciones=Array.isArray(margen)?{padding:margen}:margen;
  mapa.fitBounds(limites,{...opciones,animate:false,maxZoom:zoomTope});
  const z=mapa.getZoom();
  return Number.isFinite(z)&&z<=zoomTope;
}
/* ECUADOR ENTERO, EN EL HUECO QUE DEJAN LOS CONTROLES (24-sep-2026).
   El encuadre usaba 12 px de margen fijo, y encima del mapa estan el boton de
   capas, la leyenda, los paneles de satelite, ZSR y largo plazo, y el recuadro
   de Galapagos: tapaban la Costa, el sur o la Amazonia segun lo que hubiera
   abierto. Ahora se mide cada cosa que flota sobre el mapa y se busca el
   hueco libre mas grande: cada una se puede esquivar por arriba o abajo, o
   por un lado, y se prueban todas las combinaciones. Gana la que deja a
   Ecuador mas grande. Con zoom fraccionario (zoomSnap .25) el pais llena el
   hueco en vez de quedarse en el zoom entero de abajo. */
function margenesLibres(mapa){
  const c=mapa.getContainer(),caja=$("#mapa");
  if(!c||!caja)return {paddingTopLeft:[12,12],paddingBottomRight:[12,12]};
  const R=c.getBoundingClientRect(),W=R.width,H=R.height,aire=8;
  const menu=caja.querySelector("[data-mapa-menu]");
  const cosas=[menu&&menu.offsetParent?menu:caja.querySelector(".mapa-botones"),
    caja.querySelector(".mapa-leyenda:not([hidden])"),
    ...caja.querySelectorAll(".mapa-paneles>*:not([hidden])"),
    document.getElementById("mapa-galapagos")];
  const rects=[];
  for(const el of cosas){
    if(!el||!el.offsetParent)continue;
    const r=el.getBoundingClientRect();
    const x0=Math.max(0,r.left-R.left),x1=Math.min(W,r.right-R.left),y0=Math.max(0,r.top-R.top),y1=Math.min(H,r.bottom-R.top);
    if(x1-x0<4||y1-y0<4)continue;
    rects.push({x0,x1,y0,y1});
  }
  // Optimizar el hueco para el continente, no para el bounds del catálogo:
  // éste puede incluir Galápagos y cambiar por completo la relación de aspecto.
  const B=VISTA_MAPA.ecuador;
  const a=mapa.project([B[1][0],B[0][1]],0),b=mapa.project([B[0][0],B[1][1]],0),bw=Math.abs(b.x-a.x),bh=Math.abs(b.y-a.y);
  let mejor=null;
  for(let m=0;m<(1<<rects.length);m++){
    const p={t:aire,b:aire,l:aire,r:aire};
    rects.forEach((q,i)=>{
      const vertical=!(m&(1<<i));
      if(vertical){ if((q.y0+q.y1)/2<H/2)p.t=Math.max(p.t,q.y1+aire); else p.b=Math.max(p.b,H-q.y0+aire); }
      else{ if((q.x0+q.x1)/2<W/2)p.l=Math.max(p.l,q.x1+aire); else p.r=Math.max(p.r,W-q.x0+aire); }
    });
    const ww=W-p.l-p.r,hh=H-p.t-p.b;
    if(ww<80||hh<80)continue;
    const esc=Math.min(ww/bw,hh/bh);
    if(!mejor||esc>mejor.esc)mejor={esc,p};
  }
  const p=mejor?mejor.p:{t:12,b:12,l:12,r:12};
  return {paddingTopLeft:[p.l,p.t],paddingBottomRight:[p.r,p.b]};
}
function ajustarMapaEcuador(){
  if(!MAPA_L)return false;
  if(!encuadrar(MAPA_L,VISTA_MAPA.ecuador,margenesLibres(MAPA_L)))return false;
  // En mapas muy panorámicos, fitBounds puede abarcar las islas por el
  // espacio sobrante lateral aun usando bounds continentales. Este mínimo
  // pertenece sólo a «Ecuador»: no limita el zoom ni el arrastre posteriores.
  const centro=MAPA_L.getCenter(),W=MAPA_L.getContainer().clientWidth;
  const oeste=VISTA_MAPA.galapagos[1][1]+.25,distancia=centro.lng-oeste;
  if(distancia>0){
    const requerido=Math.log2((W+2)*360/(512*distancia));
    const salto=MAPA_L.options?.zoomSnap??.25;
    const zoom=Math.min(VISTA_MAPA.maxZoom,salto>0?Math.ceil(requerido/salto)*salto:requerido);
    if(zoom>MAPA_L.getZoom())MAPA_L.setView([centro.lat,centro.lng],zoom,{animate:false});
  }
  return true;
}

function conservarVistaMapa(mapa){
  if(!mapa)return;
  const c=mapa.getCenter(),centro=[c.lat,c.lng],zoom=mapa.getZoom();
  mapa.invalidateSize({animate:false,pan:false});
  const despues=mapa.getCenter();
  if(despues.lat!==centro[0]||despues.lng!==centro[1]||mapa.getZoom()!==zoom)
    mapa.setView(centro,zoom,{animate:false,reset:true});
}
// Abrir una capa o plegar su control nunca mueve la zona que eligió el usuario.

function actualizarBaseMapa(){

  const caja=$("#mapa"),mapa=$("#mapa-leaflet");
  if(mapa)mapa.classList.toggle("tema-mapa-oscuro",temaOscuroMapa());
  const gal=$("#mapa-galapagos");if(gal)gal.classList.toggle("tema-mapa-oscuro",temaOscuroMapa());
  if(MAPA_BASE)return;
  const atrib='Teselas &copy; <a href="https://www.esri.com/">Esri</a> — Esri, HERE, Garmin, &copy; OpenStreetMap contributors y la comunidad GIS';
  // SIN LA CAPA DE REFERENCIA, TAMPOCO EN EL MAPA PRINCIPAL.
  //
  // "World_Light_Gray_Reference" son rotulos Y LINEAS DE LIMITE, y esas lineas
  // rectas son las que se veian como una cuadricula cruzando el pais y las
  // islas. Fuera de los dos mapas. La geografia la dan los contornos
  // provinciales del propio catalogo, que son los buenos, y los nombres de las
  // estaciones estan en sus etiquetas.
  const base=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:18,attribution:atrib});
  const error=()=>{const a=caja&&caja.querySelector(".mapa-estado");if(a){a.textContent="Mapa base no disponible; cartografía local activa";a.hidden=false;}};
  const ok=()=>{const a=caja&&caja.querySelector(".mapa-estado");if(a)a.hidden=true;};
  base.on("tileerror",error);base.on("load",ok);
  MAPA_BASE=L.layerGroup([base]).addTo(MAPA_L);
  if(MAPA_GAL&&!MAPA_BASE_GAL){
    // SOLO EL FONDO, SIN LA CAPA DE REFERENCIA.
    //
    // "World_Light_Gray_Reference" son los rotulos y las lineas de limite. En
    // un recuadro de menos de 200 px los rotulos no se leen, y lo que si se ve
    // son sus lineas rectas: la que cruzaba Galapagos de arriba abajo salia de
    // ahi y del limite maritimo provincial. El recuadro esta para situar las
    // estaciones, no para leer toponimos.
    const gb=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:16,maxZoom:18});
    MAPA_BASE_GAL=L.layerGroup([gb]).addTo(MAPA_GAL);
  }
}
function aplicarLeyendaMapa(){

function aplicarCapasMapa(){

let MAPA_POP_TIMER=null;
/* ============================================================ FICHA ======
   Una sola ficha, en el panel del mapa. Ver .ficha-mapa en el CSS.

   DONDE SE COLOCA
     Se prueban cuatro sitios -arriba, abajo, derecha e izquierda de la
     estacion-, cada uno encajado dentro del panel, y se queda el que menos
     tapa. Tapar la propia estacion es lo peor; despues, los botones, la
     leyenda, el panel del satelite y el recuadro de Galapagos; despues,
     alejarse del sitio natural.

   LA PAGINA ES DINAMICA
     Se recoloca al mover o acercar cualquiera de los dos mapas y al cambiar el
     tamaño del panel -girar el movil, zoom del navegador, plegar la columna-.
     Y sobrevive al refresco: antes cada latido cerraba el popup, uno por
     minuto; ahora la ficha se queda abierta y se reescribe con el dato nuevo.
     Si la estacion sale de la vista al arrastrar, se cierra. */
const FICHA={nodo:null,latlng:null,mapa:null,codigo:null,alCerrar:null};
function fichaNodo(){
  if(FICHA.nodo&&FICHA.nodo.isConnected)return FICHA.nodo;
  const caja=$("#mapa");if(!caja)return null;
  const n=document.createElement("div");
  n.className="ficha-mapa";n.hidden=true;n.setAttribute("role","dialog");
  n.innerHTML='<button type="button" class="ficha-cerrar" aria-label="Cerrar">×</button><div class="ficha-cuerpo"></div>';
  n.querySelector(".ficha-cerrar").onclick=ev=>{ev.stopPropagation();cerrarFicha();};
  // que un clic dentro de la ficha no llegue al mapa y la cierre
  n.addEventListener("click",ev=>ev.stopPropagation());
  n.addEventListener("wheel",ev=>ev.stopPropagation(),{passive:true});
  caja.appendChild(n);FICHA.nodo=n;return n;
}
function abrirFicha(html,latlng,mapa,op={}){
  cerrarFicha();
  const n=fichaNodo();if(!n||!mapa)return;
  n.querySelector(".ficha-cuerpo").innerHTML=html;
  Object.assign(FICHA,{latlng:L.latLng(latlng),mapa,codigo:op.codigo||null,alCerrar:op.alCerrar||null});
  n.hidden=false;
  colocarFicha();
}
function cerrarFicha(){
  if(FICHA.nodo)FICHA.nodo.hidden=true;
  const f=FICHA.alCerrar;
  Object.assign(FICHA,{latlng:null,mapa:null,codigo:null,alCerrar:null});
  if(f)try{f();}catch(_){}
}
function rectEn(el,base){
  if(!el||el.hidden)return null;
  const s=getComputedStyle(el);if(s.display==="none"||s.visibility==="hidden")return null;
  const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return null;
  return {l:r.left-base.left,t:r.top-base.top,r:r.right-base.left,b:r.bottom-base.top};
}
function solapeArea(a,b){
  return Math.max(0,Math.min(a.r,b.r)-Math.max(a.l,b.l))*Math.max(0,Math.min(a.b,b.b)-Math.max(a.t,b.t));
}
function colocarFicha(){
  const n=FICHA.nodo;if(!n||n.hidden||!FICHA.mapa||!FICHA.latlng)return;
  const caja=$("#mapa");if(!caja)return;
  const rc=caja.getBoundingClientRect();
  const rm=FICHA.mapa.getContainer().getBoundingClientRect();
  const p=FICHA.mapa.latLngToContainerPoint(FICHA.latlng);
  // la estacion ya no se ve en su mapa: la ficha no tiene a que apuntar
  if(p.x<0||p.y<0||p.x>rm.width||p.y>rm.height){cerrarFicha();return;}
  const ax=rm.left-rc.left+p.x, ay=rm.top-rc.top+p.y, mg=8, sep=12;
  /* En un mapa estrecho no hay sitio para una ficha flotante que esquive
     nada: se abre como hoja a lo ancho, abajo si la estacion esta arriba y
     arriba -bajo el boton Capas- si esta abajo. Siempre sin tapar la estacion. */
  if(rc.width<520){
    n.style.width=(rc.width-2*mg)+"px";n.style.maxWidth="none";
    n.style.maxHeight=Math.max(80,rc.height*.6)+"px";
    n.style.left=mg+"px";n.style.top="0px";
    const h=n.offsetHeight;
    const btn=rectEn(caja.querySelector(".mapa-botones"),rc);
    const arriba=Math.max(mg,btn?btn.b+6:mg), abajo=rc.height-h-mg;
    let y=ay>rc.height*.5?arriba:abajo;
    if(ay>y-5&&ay<y+h+5)y=(y===arriba?abajo:arriba);
    n.style.top=Math.round(Math.max(mg,y))+"px";
    return;
  }
  n.style.width="";
  n.style.maxWidth=Math.max(160,Math.min(300,rc.width-2*mg))+"px";
  n.style.maxHeight=Math.max(80,rc.height-2*mg)+"px";
  n.style.left="0px";n.style.top="0px";
  const w=n.offsetWidth,h=n.offsetHeight;
  const obst=[caja.querySelector(".mapa-botones"),caja.querySelector(".mapa-leyenda"),
              caja.querySelector(".mapa-paneles"),
              FICHA.mapa===MAPA_L?document.getElementById("mapa-galapagos"):null]
    .map(el=>rectEn(el,rc)).filter(Boolean);
  let mejor=null;
  for(const c of [[ax-w/2,ay-h-sep],[ax-w/2,ay+sep],[ax+sep,ay-h/2],[ax-w-sep,ay-h/2]]){
    const x=Math.min(Math.max(c[0],mg),Math.max(mg,rc.width-w-mg));
    const y=Math.min(Math.max(c[1],mg),Math.max(mg,rc.height-h-mg));
    const r={l:x,t:y,r:x+w,b:y+h};
    let coste=Math.abs(x-c[0])+Math.abs(y-c[1]);
    for(const o of obst)coste+=solapeArea(r,o);
    if(ax>r.l-5&&ax<r.r+5&&ay>r.t-5&&ay<r.b+5)coste+=1e7;
    if(!mejor||coste<mejor.coste)mejor={x,y,coste};
  }
  n.style.left=Math.round(mejor.x)+"px";n.style.top=Math.round(mejor.y)+"px";
}
function abrirFichaEstacion(x,d,mapa=null){
  const sinTx=finito(x.horas_sin_dato)&&x.horas_sin_dato>=5;
  const aviso=sinTx?`<div class="sin-transmision">× Sin transmisión durante ${num(x.horas_sin_dato,1)} h</div>`:"";
  abrirFicha(aviso+fichaHTML(x,d),[x.lat,x.lon],mapa||(x.lon<-82?MAPA_GAL:MAPA_L),{codigo:x.codigo});

document.addEventListener("keydown",ev=>{if(ev.key==="Escape")cerrarFicha();});

function popupDinamico(layer){
  // El popup se abre únicamente por clic. Leaflet lo cierra al pulsar el mapa,
  // otra estación o capa; no hay cierre prematuro al mover el cursor.
  return layer;
}

function seleccionarEstacionMapa(x,m){
  M.sel=x.codigo;
  document.querySelectorAll("[data-cod]").forEach(n=>n.setAttribute("aria-selected",n.getAttribute("data-cod")===M.sel));
  MAPA_CAPAS.estaciones.eachLayer(z=>{
    const sel=z._codigo===M.sel;z._seleccionada=sel;
    if(z.setStyle)z.setStyle({color:sel?cssMapa("--tinta","#12181F"):(z._bordeBase||cssMapa("--fondo","#fff")),weight:sel?2.2:(z._pesoBase||1)});
    if(sel&&z.bringToFront)z.bringToFront();

  });
  if(MAPA_GAL_CAPAS.estaciones)MAPA_GAL_CAPAS.estaciones.eachLayer(z=>{
    const sel=z._codigo===M.sel;z._seleccionada=sel;
    if(z.setStyle)z.setStyle({color:sel?cssMapa("--tinta","#12181F"):(z._bordeBase||cssMapa("--fondo","#fff")),weight:sel?2.2:(z._pesoBase||1)});
    if(sel&&z.bringToFront)z.bringToFront();
    if(z.setZIndexOffset)z.setZIndexOffset(sel?1000:0);
  });
  escalaMapa();pintarSerie();
}
function prepararPanesEstaciones(mapa){
  [["estacionesSinTx",390],["estacionesNormal",430],["estacionesMedio",450],
   ["estacionesAlto",470],["estacionesMuyAlto",490]].forEach(([nombre,z])=>{
    const p=mapa.getPane(nombre)||mapa.createPane(nombre);p.style.zIndex=String(z);
  });
}
function paneEstacion(x,sinTx){
  if(sinTx)return"estacionesSinTx";
  if(x.alerta==="emergencia")return"estacionesMuyAlto";
  if(x.alerta==="alerta")return"estacionesAlto";
  if(x.alerta==="atencion")return"estacionesMedio";
  return"estacionesNormal";
}
function pintarMapa(){
  const d=M.d,caja=$("#mapa");if(!d||!caja)return;
  if(typeof L==="undefined"){caja.innerHTML='<div class="calma">No se pudo cargar el motor cartográfico Leaflet.</div>';return;}
  if(!MAPA_L){
    caja.innerHTML='<div id="mapa-leaflet" aria-label="Mapa dinámico de estaciones"></div>'+herramientasMapaHTML(d);
    MAPA_L=L.map("mapa-leaflet",opcionesMapa());
    MAPA_GAL=L.map("mapa-galapagos",opcionesMapa(true));
    prepararPanesEstaciones(MAPA_L);prepararPanesEstaciones(MAPA_GAL);
    // Sin barra de escala. Ocupaba la esquina inferior izquierda, que es donde
    // va el control del satelite, y en un mapa que siempre encuadra el mismo
    // pais la escala no cambia y no se consulta nunca.
    actualizarBaseMapa();
    MAPA_L.on("zoom zoomend",escalaMapa);
    MAPA_L.on("move zoom viewreset",colocarFicha);MAPA_GAL.on("move zoom viewreset",colocarFicha);
    MAPA_L.on("moveend zoomend",miniaturaGalapagos);
    const plegarMenu=()=>{const col=caja.querySelector(".mapa-botones.abierto");
      if(col){col.classList.remove("abierto");const b=caja.querySelector("[data-mapa-menu]");if(b)b.setAttribute("aria-expanded","false");}};
    MAPA_L.on("click",()=>{cerrarFicha();plegarMenu();});MAPA_GAL.on("click",()=>{cerrarFicha();plegarMenu();});
    if(window.ResizeObserver)new ResizeObserver(()=>colocarFicha()).observe(caja);
    caja.addEventListener("mouseleave",ev=>{
      // solo si el raton sale del panel entero, no al pasar a la ficha
      if(!ev.relatedTarget||!caja.contains(ev.relatedTarget))cerrarFicha();});
  }else{const l=caja.querySelector(".mapa-leyenda");if(l)l.innerHTML=leyendaMapaDinamica(d);}
  // La ficha abierta sobrevive al refresco con el dato nuevo. Las de complejos
  // y centrales se cierran: sus capas se rehacen y el resaltado se perderia.
  if(FICHA.codigo){
    const xf=(d.estaciones||[]).find(z=>z.codigo===FICHA.codigo);
    if(xf&&finito(xf.lat)&&finito(xf.lon))abrirFichaEstacion(xf,d,FICHA.mapa);else cerrarFicha();
  }else if(FICHA.latlng)cerrarFicha();
  for(const k of Object.keys(MAPA_CAPAS)){
    if(MAPA_CAPAS[k]&&MAPA_L.hasLayer(MAPA_CAPAS[k]))MAPA_L.removeLayer(MAPA_CAPAS[k]);
    MAPA_CAPAS[k]=L.layerGroup();
  }
  for(const k of Object.keys(MAPA_GAL_CAPAS)){
    if(MAPA_GAL_CAPAS[k]&&MAPA_GAL.hasLayer(MAPA_GAL_CAPAS[k]))MAPA_GAL.removeLayer(MAPA_GAL_CAPAS[k]);
    MAPA_GAL_CAPAS[k]=L.layerGroup();
  }
  /* CONTORNO CON HALO, PARA QUE SE VEA SOBRE EL SATELITE.
     Un trazo fino gris se pierde igual sobre la nube blanca que sobre el suelo
     oscuro, y con la imagen de satelite encendida el pais dejaba de
     distinguirse. Se dibuja DOS VECES: primero una linea blanca mas gruesa y
     encima la negra mas fina. El resultado es un borde que contrasta contra
     cualquier fondo, claro u oscuro, porque lleva los dos colores pegados.
     Es el mismo recurso que se usa para rotular mapas sobre ortofoto. */
  const carto=M.carto||{};
  const provHalo={color:"#FFFFFF",weight:2.6,opacity:.9,fill:false};
  const provStyle={color:"#000000",weight:1.1,opacity:.85,
                   fillColor:cssMapa("--tierra","#E9ECF1"),fillOpacity:.04};
  if(carto.provincias){
    L.geoJSON(carto.provincias,{style:provHalo,interactive:false}).addTo(MAPA_CAPAS.provincias);
    L.geoJSON(carto.provincias,{style:provStyle,interactive:false}).addTo(MAPA_CAPAS.provincias);
  }
  if(carto.provincias_insular && MAPA_GAL_CAPAS.provincias){
    // En el recuadro insular tambien: con satelite, las islas se confunden con
    // la nube si no llevan borde.
    L.geoJSON(carto.provincias_insular,{style:provHalo,interactive:false}).addTo(MAPA_GAL_CAPAS.provincias);
    L.geoJSON(carto.provincias_insular,{style:{...provStyle,weight:.9},interactive:false}).addTo(MAPA_GAL_CAPAS.provincias);
    L.geoJSON(carto.provincias_insular,{style:provHalo,interactive:false}).addTo(MAPA_CAPAS.provincias);
    L.geoJSON(carto.provincias_insular,{style:provStyle,interactive:false}).addTo(MAPA_CAPAS.provincias);
  }
  // El contorno insular es el limite MARITIMO, un rectangulo de lineas rectas
  // que en el recuadro se lee como una grilla encima de las islas. Fuera.

  MAPA_CAPAS.provincias.addTo(MAPA_L);
  MAPA_GAL_CAPAS.provincias.addTo(MAPA_GAL);
  // El encuadre de Galapagos va en ajustarMapaGalapagos() y se reintenta en
  // cada latido hasta que la caja se puede medir; ver encuadrar().
  if(!MAPA_GAL_AJUSTADO)MAPA_GAL_AJUSTADO=ajustarMapaGalapagos();
  if(carto.complejos){
    const normal={color:cssMapa("--hidro","#16835F"),weight:2,opacity:.82,dashArray:"5 4",fillColor:cssMapa("--hidro-cl","#52B788"),fillOpacity:.12};
    L.geoJSON(carto.complejos,{style:normal,onEachFeature:(f,l)=>{
      const nombre=(f.properties&&f.properties.nombre)||"Complejo hidroeléctrico";
      l.on("click",ev=>setTimeout(()=>{
        l.setStyle({weight:3.2,fillOpacity:.20,dashArray:null});
        abrirFicha(`<b>${esc(nombre)}</b><br><span style="color:var(--tinta3);font-size:10.5px">Complejo hidroeléctrico</span>`,
          ev.latlng,MAPA_L,{alCerrar:()=>l.setStyle(normal)});},0));
      popupDinamico(l);

    }}).addTo(MAPA_CAPAS.complejos);
  }
  if(carto.centrales)L.geoJSON(carto.centrales,{pointToLayer:(f,ll)=>{
      const m=L.circleMarker(ll,{radius:4.5,color:cssMapa("--fondo","#fff"),weight:1.3,fillColor:cssMapa("--hidro","#16835F"),fillOpacity:.95});m._radioBase=4.5;return m;},
    onEachFeature:(f,l)=>{const p=f.properties||{},nombre=p.nombre||"Central hidroeléctrica";
      l.on("click",()=>setTimeout(()=>{
        l.setRadius(7);l.setStyle({fillColor:cssMapa("--hidro-cl","#52B788"),weight:2});
        abrirFicha(`<b>${esc(nombre)}</b><br><span style="color:var(--tinta3);font-size:10.5px">Central hidroeléctrica${p.potencia?` · ${num(p.potencia,0)} MW`:""}</span>`,
          l.getLatLng(),MAPA_L,{alCerrar:()=>{l.setRadius(4.5);l.setStyle({fillColor:cssMapa("--hidro","#16835F"),weight:1.3});}});},0));
      popupDinamico(l);

    }}).addTo(MAPA_CAPAS.centrales);
  const lluvia=d.variable==="precipitacion";
  for(const x of (d.estaciones||[]).filter(x=>finito(x.lat)&&finito(x.lon))){
    // Las islas también se pueden explorar en el principal. Cada mapa necesita
    // sus propias capas Leaflet, con el mismo dato y selección de estación.
    for(const destino of (x.lon < -82 ? [MAPA_CAPAS,MAPA_GAL_CAPAS] : [MAPA_CAPAS])){
    const sinTx=finito(x.horas_sin_dato)&&x.horas_sin_dato>=5,activa=lluvia&&x.fase_lluvia==="activa",sel=M.sel===x.codigo;
    let m,base=lluvia?(activa?5.8:3.8):radioEstacion(x);
    if(sinTx){
      const icon=L.divIcon({className:`estacion-sin-transmitir${sel?" seleccionada":""}`,html:"<span>×</span>",iconSize:[20,20],iconAnchor:[10,10]});
      m=L.marker([x.lat,x.lon],{icon,pane:paneEstacion(x,true),keyboard:true,title:`${x.codigo} · sin transmisión`,zIndexOffset:-1000});
    }else{
      /* EL RIESGO VA EN EL RELLENO, NO EN UN ANILLO.
         En meteorologico el relleno decia si llovia ahora -azul o gris- y el
         nivel de riesgo iba solo en el borde. Un borde de 2 px que ademas
         escalaMapa() dejaba en 1 px, y que seleccionarEstacionMapa() borraba
         del todo al pulsar cualquier estacion. Resultado: una estacion en
         "Muy alto" se veia como un punto gris con un filo rojo apenas visible.
         Y la leyenda los pintaba rellenos, asi que el mapa contradecia a su
         propia leyenda.
         Ahora el riesgo manda en los dos modos: relleno del color del nivel,
         tamaño creciente con la gravedad, halo blanco que lo separa del fondo
         y de los vecinos, y su propio pane por encima del resto. El azul de
         "llueve ahora" queda para las estaciones sin riesgo. */
      const colorNivel=x.alerta==="emergencia"?cssMapa("--emergencia","#B3261E"):
        x.alerta==="alerta"?cssMapa("--alerta","#C2410C"):
        x.alerta==="atencion"?cssMapa("--atencion","#D97706"):null;

      if(colorNivel)base=radioEstacion(x);
      else if(lluvia)base=activa?4.6:3.4;
      const color=colorNivel||(lluvia?(activa?cssMapa("--lluvia","#1D6FA8"):cssMapa("--seco","#9AA4B2"))
                                     :cssMapa("--tinta3","#8A94A6"));
      const bordeBase=colorNivel?"#FFFFFF":cssMapa("--fondo","#fff");
      const pesoBase=colorNivel?1.6:1;
      m=L.circleMarker([x.lat,x.lon],{pane:paneEstacion(x,false),radius:sel?base+2:base,
        color:sel?cssMapa("--tinta","#12181F"):bordeBase,weight:sel?2.2:pesoBase,
        fillColor:color,fillOpacity:colorNivel?1:(activa?.95:.85)});
      m._radioBase=base;m._bordeBase=bordeBase;m._pesoBase=pesoBase;

    }

  if(M.fam!=="clima"){MAPA_CAPAS.estaciones.addTo(MAPA_L);MAPA_GAL_CAPAS.estaciones.addTo(MAPA_GAL);}
  aplicarCapasMapa();aplicarLeyendaMapa();
  caja.querySelectorAll("[data-mapa-encuadre]").forEach(b=>b.onclick=()=>{
    cerrarFicha();if(b.dataset.mapaEncuadre==="galapagos")explorarGalapagos();

  caja.querySelectorAll("[data-mapa-productos]").forEach(b=>b.onclick=async()=>{cerrarFicha();await prAlternar();reencuadrarEcuador();});
  const leyenda=caja.querySelector("[data-mapa-leyenda]");if(leyenda)leyenda.onclick=()=>{M.mapa.leyenda=!M.mapa.leyenda;aplicarLeyendaMapa();reencuadrarEcuador();};
  // Satelite GOES. El mapa se redibuja entero en cada latido, asi que hay que
  // volver a pintar la capa: el nodo anterior ya no existe.
  const menu=caja.querySelector("[data-mapa-menu]");
  if(menu)menu.onclick=()=>{
    const col=caja.querySelector(".mapa-botones"),ab=!col.classList.contains("abierto");
    col.classList.toggle("abierto",ab);menu.setAttribute("aria-expanded",ab);colocarFicha();};
  const sat=caja.querySelector("[data-mapa-satelite]");
  if(sat){sat.onclick=goesAlternar;}
  // El satelite NO se vuelve a montar en cada latido: el mapa se crea una sola
  // vez y sus cuadros siguen ahi (ver SATELITE GOES). Solo se monta si esta
  // encendido y aun no hay nada.
  if(M.fam!=="clima"&&M.mapa.satelite&&!GOES.cuadros.length&&!GOES.recarga)goesCargar();
  // en Climatologia el encuadre lo hace modoClima(), con su panel ya pintado
  if(!MAPA_AJUSTADO&&M.fam!=="clima")MAPA_AJUSTADO=ajustarMapaEcuador();

  /* Cambiar el tamaño conserva centro y zoom del principal. Solo el recuadro,
     que no tiene navegación propia, vuelve a ajustar su caja insular fija. */
  if(window.ResizeObserver && !MAPA_L._observador){

/* Ficha flotante sobre el mapa. Muestra lo mismo que haria falta preguntar en
   una sala de crisis: cuanto lleva, cuanto ha subido, en que estado esta y de
   cuando es el dato. El <title> de SVG no vale: tarda en salir y no da formato. */
function fichaHTML(x,d){
  const lluvia=d.variable==="precipitacion", ac=x.acumulados||{};
  const EST={atencion:"Medio",alerta:"Alto",emergencia:"Muy alto",normal:"Normal","sin umbral":"Sin umbral"};
  const sinTx=finito(x.horas_sin_dato)&&x.horas_sin_dato>=5;
  const estado=sinTx?"No transmite":(EST[x.alerta]||x.alerta||"Normal");
  const dec=decVar(d.variable,x.ultimo), instante=`${num(x.ultimo,dec)} ${d.unidad||""}`;
  let filas="";
  if(lluvia)filas=`<div class="mp-res"><span>1 h <b>${finito(ac[1])?num(ac[1],1):"—"}</b></span><span>6 h <b>${finito(ac[6])?num(ac[6],1):"—"}</b></span><span>24 h <b>${finito(ac[24])?num(ac[24],1):"—"}</b></span></div>`;
  else if(finito(x.pendiente_h))filas=`<div class="mp-fila"><span>Cambio/h</span><b>${x.pendiente_h>0?"▲ ":x.pendiente_h<0?"▼ ":""}${num(Math.abs(x.pendiente_h),dec+1)}</b></div>`;
  return `<div class="mp-cab"><b>${esc(x.codigo)}</b><span class="eti e-${sinTx?"mudo":String(x.alerta||"normal").replace(/\s/g,"")}">${esc(estado)}</span></div>
    <div class="mp-nom">${esc(x.nombre||"")}</div>
    <div class="mp-valor">${esc(instante)}</div>${filas}
    <div class="mp-pie">${hora(x.ultimo_t)}${x.sospecha?`<br><strong>⚠ Dato apartado por QC</strong>`:""}</div>`;
}
function moverPopup(ev){
  const caja=$("#mapa"), pop=$("#popup");
  if(!caja||!pop)return;
  const r=caja.getBoundingClientRect();
  // Se mide DESPUES de escribir el contenido y con el popup ya visible; antes
  // se usaban las medidas de la ficha anterior y en las estaciones del borde
  // se salia del panel.
  const pw=pop.offsetWidth||170, ph=pop.offsetHeight||90;
  let x=ev.clientX-r.left+14;
  let y=ev.clientY-r.top+12;
  if(x+pw>r.width-4)x=ev.clientX-r.left-pw-14;   // se pasa al otro lado
  if(x<4)x=4;
  if(y+ph>r.height-4)y=ev.clientY-r.top-ph-12;   // arriba en vez de abajo
  if(y<4)y=4;
  pop.style.left=Math.round(x)+"px";
  pop.style.top=Math.round(y)+"px";
}
/* Zoom y arrastre. Se exige Ctrl para la rueda a proposito: sin esa tecla la
   rueda desplaza la pagina, y un mapa que secuestra el scroll es de las cosas
   que mas molestan cuando se revisa un tablero entero. */
function engancharZoom(){
  const caja=$("#mapa"); if(!caja)return;
  const W=MAPA_W,H=MAPA_H;
  const limitar=()=>{
    const z=M.mapa;
    z.k=Math.max(1,Math.min(z.k,14));
    const w=W/z.k,h=H/z.k;
    z.x=Math.max(0,Math.min(z.x,W-w));
    z.y=Math.max(0,Math.min(z.y,H-h));
  };
  caja.onwheel=ev=>{
    if(!ev.ctrlKey)return;              // sin Ctrl, la pagina se desplaza normal
    ev.preventDefault();
    const z=M.mapa, r=caja.getBoundingClientRect();
    // el svg conserva proporcion, asi que hay bandas a los lados: se calcula
    // donde cae el cursor DENTRO del dibujo, no del contenedor
    const esc=Math.min(r.width/W, r.height/H);
    const dx=(r.width-W*esc)/2, dy=(r.height-H*esc)/2;
    const sx=z.x+((ev.clientX-r.left-dx)/esc)/z.k;
    const sy=z.y+((ev.clientY-r.top-dy)/esc)/z.k;
    if(!isFinite(sx)||!isFinite(sy))return;
    const antes=z.k;
    z.k=Math.max(1,Math.min(z.k*(ev.deltaY<0?1.22:1/1.22),14));
    if(z.k===antes)return;
    // el punto bajo el cursor no se mueve
    z.x=sx-(sx-z.x)*(antes/z.k);
    z.y=sy-(sy-z.y)*(antes/z.k);
    limitar(); pintarMapa();
  };
  let arr=null;
  caja.onmousedown=ev=>{
    if(M.mapa.k<=1.01||ev.button!==0)return;
    if(ev.target.closest("circle[data-pop]"))return;   // clic en estacion manda
    arr={x:ev.clientX,y:ev.clientY,ox:M.mapa.x,oy:M.mapa.y};
    caja.classList.add("arrastrando");
  };
  window.addEventListener("mousemove",ev=>{
    if(!arr)return;
    const r=caja.getBoundingClientRect();
    const esc=Math.min(r.width/W,r.height/H)*M.mapa.k;
    M.mapa.x=arr.ox-(ev.clientX-arr.x)/esc;
    M.mapa.y=arr.oy-(ev.clientY-arr.y)/esc;
    limitar(); pintarMapa();
  });
  window.addEventListener("mouseup",()=>{
    if(arr){arr=null;caja.classList.remove("arrastrando");}});
  caja.ondblclick=()=>{M.mapa={k:1,x:0,y:0};pintarMapa();};
  caja.classList.toggle("zoom",M.mapa.k>1.01);
}

/* Explica por que se descarta un sensor. "No parece lluvia" por si solo no dice

    const r=a.getBoundingClientRect();

    pop.style.left=Math.max(12,Math.min(r.left,window.innerWidth-ancho-12))+"px";
    pop.style.top=(r.bottom+6)+"px";
    pop.style.position="fixed";
  };
  a.onmouseleave=()=>{const p=$("#pop-sensor");if(p)p.hidden=true;};
}

function engancharMapa(){
  const caja=$("#mapa"); if(!caja)return;

  caja.onmousemove=ev=>{
    const c=ev.target.closest("circle[data-pop]");

// normal, que es lo que pasaría si ambas leyeran "temp_aire_c" sin separar
const VAR_LAKE={nivel:"nivel_m",caudal:"caudal_m3s",precipitacion:"precipitacion_mm",
  temp_aire:"temp_aire_max"};


/* -------------------------------------------------- pronostico por estacion */
/* Las laminas se generan aparte dos veces al dia; aqui solo se eligen. El indice
   se pide UNA vez: son imagenes en disco, no cambian entre latidos. */
const PRON = { idx:null, cargando:null };

function cargarPron(){
  if(PRON.idx) return Promise.resolve(PRON.idx);
  if(!PRON.cargando){
    PRON.cargando = fetch("api/laminas",{cache:"no-store"})
      .then(r=>r.json()).then(d=>{PRON.idx=d;return d;})
      .catch(e=>{PRON.idx={estaciones:{},vistas:[],error:e.message};return PRON.idx;});
  }
  return PRON.cargando;
}

// el fichero usa guion bajo donde el codigo lleva espacio (Coca Codo Sinclair)
const claveLamina = cod => String(cod||"").replace(/ /g,"_");

/* Que otras variables hidrologicas mide ESTA estacion.

   La red no separa estaciones "de nivel" y "de caudal": son la misma. 287 de las
   296 con caudal miden tambien nivel, y en 18 de las 29 activas el caudal ni
   siquiera se mide -se deduce del nivel con la curva de descarga-. Las unicas
   nueve con caudal y sin nivel son las de CENACE, que calculan afluente por
   balance del embalse y no tienen limnimetro de rio.

   Separarlas en el desplegable obligaba a buscar dos veces la misma estacion.
   Aqui se consulta que mas tiene y se ofrece el salto conservando la seleccion.
   No se dibujan juntas en un eje: metros y m3/s no comparten escala, y un eje
   doble miente sobre la relacion entre las dos curvas. */
const HIDRO_HERMANAS = ["nivel", "caudal"];
const OTRAS = {};        // codigo -> [variables con dato en la ventana]

// Cache corta del censo de hermanas.
//
// Esto solo sirve para saber QUE estaciones tienen dato en la otra variable
// hidrologica, para ofrecer el salto. No es el dato que se dibuja, asi que no
// necesita estar al segundo. Y sin cache se notaba: en la publicacion estatica
// el adaptador ignora el parametro `horas` y devuelve el MISMO fichero, asi que
// nivel.json (427 kB) y caudal.json (194 kB) se descargaban dos veces en cada
// carga -620 kB de mas- y en el servidor en vivo eran dos consultas extra a la
// base para una respuesta que no habia cambiado.
const _CENSO = {};
const CENSO_TTL_MS = 120000;
async function _pulsoCensado(v, horas){
  const k = `${v}|${horas}`, ahora = Date.now();
  if(_CENSO[k] && ahora - _CENSO[k].t < CENSO_TTL_MS) return _CENSO[k].p;
  const p = fetch(`api/pulso?variable=${v}&horas=${horas}`).then(r=>r.json());
  _CENSO[k] = {t: ahora, p};
  return p;
}

async function censarHermanas(){
  const fam = M.fam, horas = document.getElementById("f-horas").value;
  await Promise.all(HIDRO_HERMANAS.map(async v=>{
    if(v === M.d.variable) return;
    try{
      const d = await _pulsoCensado(v, horas);
      (d.estaciones||[]).forEach(e=>{
        if(e.ultimo == null) return;
        (OTRAS[e.codigo] = OTRAS[e.codigo] || []);
        if(!OTRAS[e.codigo].includes(v)) OTRAS[e.codigo].push(v);
      });
    }catch(e){ /* si falla, simplemente no se ofrece el salto */ }
  }));
  if(M.fam === fam) pintarHermanas();
}

function pintarHermanas(){
  const cont = document.getElementById("serie-tit");
  if(!cont || !M.sel) return;
  cont.querySelectorAll(".hermana").forEach(x=>x.remove());
  (OTRAS[M.sel]||[]).filter(v=>v!==(M.d||{}).variable).forEach(v=>{
    const b = document.createElement("button");
    b.className = "hermana";
    // sin los parentesis, "ver "+undefined ya es una cadena verdadera y el
    // || nunca llegaba a actuar: salia literalmente "ver undefined"
    const et = ((M.vars||{})[v]||{}).etiqueta || v;
    b.textContent = "ver " + String(et).toLowerCase();
    b.title = "La misma estación mide también esta variable";
    b.onclick = () => {
      const sel = document.getElementById("f-var");
      const recordar = M.sel;
      sel.value = v; sel.dispatchEvent(new Event("change"));
      // la seleccion se restaura cuando llegue el nuevo pulso
      M.pendiente = recordar;
    };
    cont.appendChild(b);
  });
}

function pintarBotonesPron(){
  const g = document.getElementById("v-pron-grupo");
  const d = PRON.idx;
  // En METEOROLOGICO los botones son los de lluvia y temperatura. Son otra
  // cosa que las vistas hidrologicas -no hay laminas por horizonte- asi que se
  // pintan aparte y se sale.
  if(M.fam==="meteo"){
    const vistas = vistasMeteoDe($("#f-var").value);
    if(!vistas.length){ g.style.display="none"; return; }
    cargarPronMeteo().then(pm=>{

        <button data-pv="meteo:${id}" ${hay&&hay.series&&hay.series[id]?"":"disabled"}
          aria-pressed="${M.vista==="meteo:"+id}"
          title="${esc(nombre)} — ${esc(nota)}${hay?"":" · esta estación no tiene serie diaria suficiente"}">${esc(nombre)}</button>`).join("");
      g.querySelectorAll("button").forEach(b=>{

          document.getElementById("v-serie").setAttribute("aria-pressed",false);
